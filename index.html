<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PCB Circuit Designer</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: #1a1a2e;
                color: #eaeaea;
                height: 100vh;
                overflow: hidden;
                display: grid;
                grid-template-columns: 340px minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
            }
            .top-toolbar {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 20px;
                background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
                border-bottom: 1px solid #0f3460;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
                flex-wrap: wrap;
                row-gap: 10px;
                z-index: 100;
            }
            /* Dividers only make sense while the sections sit on one row —
               drop them as soon as the toolbar wraps. */
            .toolbar-section {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }
            .toolbar-section:last-child {
                border-right: none;
                padding-right: 0;
            }
            .toolbar-section:first-child {
                padding-left: 0;
            }
            @media (max-width: 900px) {
                .toolbar-section {
                    border-right: none;
                    padding: 0;
                }
            }
            .toolbar-section-title {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #8899bb;
                font-weight: 600;
                margin-right: 8px;
            }
            
            /* Toolbar Inputs */
            .toolbar-input-group {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .toolbar-input-group label {
                font-size: 12px;
                color: #ccc;
                white-space: nowrap;
            }
            .toolbar-input-group input {
                width: 70px;
                padding: 6px 10px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #fff;
                font-size: 13px;
                outline: none;
            }
            .toolbar-input-group input:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }
            
            /* Toolbar Buttons */
            .toolbar-btn {
                padding: 8px 14px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #eaeaea;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            .toolbar-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .toolbar-btn.active {
                background: #4dabf7;
                border-color: #4dabf7;
                color: #1a1a2e;
                font-weight: 600;
            }
            .toolbar-btn.active:hover {
                background: #74c0fc;
            }
            
            /* Toolbar Toggle Buttons (segmented control) */
            .toolbar-toggle {
                display: flex;
                border-radius: 4px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
            .toolbar-toggle .toolbar-btn {
                border-radius: 0;
                border: none;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }
            .toolbar-toggle .toolbar-btn:last-child {
                border-right: none;
            }
            
            /* Left Sidebar: Components (top) + Inspector/BOM (bottom) */
            .sidebar {
                grid-column: 1;
                grid-row: 2;
                min-height: 0;
                min-width: 0;
                display: grid;
                /* Inspector row: a floor plus a fraction of the sidebar. The 1fr row
                   above it can shrink to 0, so short viewports squeeze the
                   component list rather than overflowing the body. */
                grid-template-rows: minmax(0, 1fr) minmax(140px, 40%);
                background: #16213e;
                border-right: 1px solid #0f3460;
                overflow: hidden;
            }

            /* Components panel fills remaining sidebar space */
            .components-panel {
                min-height: 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .sidebar-header {
                padding: 14px 16px;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.2);
            }
            .sidebar-header h2 {
                font-size: 14px;
                font-weight: 600;
                color: #fff;
                letter-spacing: 0.3px;
            }
            .component-search {
                width: calc(100% - 32px);
                padding: 10px 12px;
                margin: 12px 16px 0;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: #131313;
                font-weight: 600;
                font-size: 13px;
                outline: none;
            }
            .component-search:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }
            .component-search::placeholder {
                color: #667799;
            }
            /* NOTE: style.css is a legacy sheet that still carries light-theme
               rules for the older prototypes. It loads FIRST, so every rule
               below must match or beat its specificity, or it silently wins. */
            .selected-banner,
            #selected-component-banner {
                width: calc(100% - 32px);
                margin: 10px 16px 0;
                padding: 10px 12px;
                background: rgba(76, 175, 80, 0.15);
                border: 1px solid rgba(76, 175, 80, 0.35);
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.4;
                color: #a5d6a7;
                display: none;
            }
            .selected-banner.visible {
                display: block;
            }
            .component-list-wrapper {
                flex: 1;
                overflow-y: auto;
                padding: 8px 16px 16px;
            }
            /* Beats style.css's light-theme .component-group-label, which still
               paints a purple pill behind these dark-theme labels. */
            .component-group-label {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #7f93b8;
                background: none;
                padding: 10px 10px 6px;
                margin: 12px 0 0;
                border-radius: 0;
                border-bottom: 1px solid rgba(127, 147, 184, 0.2);
            }
            .component-group-label:first-child {
                margin-top: 0;
            }
            .component-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .component-btn {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
                padding: 9px 10px;
                min-height: 46px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #eaeaea;
                font-size: 12px;
                line-height: 1.35;
                text-align: left;
                cursor: pointer;
                transition: all 0.15s ease;
            }
            .component-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-1px);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            }
            .component-btn.selected {
                background: rgba(76, 175, 80, 0.2);
                border-color: #4caf50;
                box-shadow: 0 0 0 1px #4caf50;
            }
            /* style.css renders a hover tooltip above the button, but the
               list scrolls inside overflow:auto so that tooltip is clipped
               for the top rows. Footprint is shown inline instead. */
            .component-btn::before,
            .component-btn::after {
                content: none;
            }
            .component-btn .btn-label {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                width: 100%;
            }
            .component-btn .btn-tooltip {
                font-size: 10px;
                color: #7f93b8;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
                margin-top: 0;
            }
            .component-btn.selected .btn-tooltip {
                color: #a5d6a7;
            }
            /* style.css renders this dark navy — invisible on the dark
               sidebar. Without it, a failed search shows no feedback. */
            .component-empty-msg {
                color: #8899bb;
                font-size: 12px;
                font-style: italic;
                text-align: center;
                padding: 24px 8px;
                line-height: 1.5;
            }
            
            /* Canvas Area - full right side */
            .canvas-area {
                grid-column: 2;
                grid-row: 2;
                min-width: 0;
                min-height: 0;
                position: relative;
                overflow: hidden;
                background: radial-gradient(ellipse at center, #1a1a3e 0%, #0d0d1a 100%);
            }
            #three-canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            /* =========================================================
               COMPONENT PROPERTIES VIEWER
               Sits inside .canvas-area (which is position:relative) and is
               anchored to the right edge. It is hidden with display:none so it
               never steals space from the canvas while closed.
               ========================================================= */
            .props-panel {
                position: absolute;
                top: 16px;
                right: 16px;
                bottom: 16px;
                width: 340px;
                max-width: calc(100% - 32px);
                display: none;
                flex-direction: column;
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 8px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
                overflow: hidden;
                z-index: 10;
            }
            .props-panel.visible {
                display: flex;
            }
            .props-header {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 14px;
                background: rgba(0, 0, 0, 0.25);
                border-bottom: 1px solid #0f3460;
                flex-shrink: 0;
            }
            .props-title-group {
                flex: 1;
                min-width: 0;
            }
            .props-title {
                font-size: 13px;
                font-weight: 700;
                color: #fff;
                line-height: 1.3;
                word-break: break-word;
            }
            .props-subtitle {
                font-size: 10px;
                color: #8899bb;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                margin-top: 3px;
                word-break: break-word;
            }
            .props-subtitle:empty {
                display: none;
            }
            .props-close {
                flex-shrink: 0;
                width: 26px;
                height: 26px;
                padding: 0;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 5px;
                color: #eaeaea;
                font-size: 17px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.15s ease, border-color 0.15s ease;
            }
            .props-close:hover {
                background: rgba(255, 90, 90, 0.25);
                border-color: rgba(255, 90, 90, 0.5);
                color: #fff;
            }
            /* Scrollable content area — the header and close button stay put. */
            .props-body {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 12px 14px 16px;
            }
            .props-section-title {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: #4dabf7;
                margin: 16px 0 7px;
                padding-bottom: 4px;
                border-bottom: 1px solid rgba(77, 171, 247, 0.2);
            }
            .props-section-title:first-child {
                margin-top: 0;
            }
            .props-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10px;
                padding: 4px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 11px;
            }
            /* Child rows of a nested object/array are indented one step. */
            .props-row-nested {
                padding-left: 14px;
            }
            /* Label-only row that names a nested object/array. */
            .props-row-group {
                justify-content: flex-start;
                padding-bottom: 2px;
                border-bottom: none;
            }
            .props-row-group .props-key {
                max-width: 100%;
                color: #cce;
                font-weight: 700;
                margin-top: 4px;
            }
            .props-key {
                color: #8899bb;
                flex-shrink: 1;
                max-width: 52%;
                word-break: break-word;
            }
            .props-val {
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }
            .props-json {
                margin: 0;
                padding: 10px;
                background: rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #9fe0b0;
                font-family: Consolas, Menlo, "Courier New", monospace;
                font-size: 11px;
                line-height: 1.5;
                /* pre keeps the indentation from formatComponentJSON intact */
                white-space: pre;
                overflow-x: auto;
            }
            
            /* Inspector/BOM: bottom of LEFT sidebar only.
               Height is fully controlled by the sidebar grid row above —
               no min/max-height needed here. */
            .inspector-panel {
                height: 100%;
                min-height: 0;
                background: #16213e;
                border-top: 2px solid #0f3460;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .inspector-header {
                padding: 0;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.25);
                flex-shrink: 0;
            }
            /* Tab strip */
            .inspector-tabs {
                display: flex;
                align-items: stretch;
            }
            .inspector-tab {
                flex: 1;
                padding: 10px 8px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                cursor: pointer;
                transition: color 0.15s, border-color 0.15s, background 0.15s;
                text-align: center;
            }
            .inspector-tab:hover {
                color: #cce;
                background: rgba(255,255,255,0.04);
            }
            .inspector-tab.active {
                color: #4dabf7;
                border-bottom-color: #4dabf7;
                background: rgba(77,171,247,0.06);
            }
            /* Tab panes */
            .inspector-pane {
                display: none;
            }
            .inspector-pane.active {
                /* flex: 1 + min-height: 0 lets the pane fill the remaining
                   panel height without overflowing its container */
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 10px 14px 12px;
                font-size: 12px;
                color: #bbb;
            }
            /* Info pane: key-value rows */
            .info-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding: 5px 0;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                gap: 8px;
            }
            .info-row:last-child { border-bottom: none; }
            .info-key {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                flex-shrink: 0;
            }
            .info-val {
                font-size: 12px;
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }
            /* BOM summary badges */
            .bom-badges {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }
            .bom-badge {
                flex: 1;
                background: rgba(77,171,247,0.1);
                border: 1px solid rgba(77,171,247,0.2);
                border-radius: 6px;
                padding: 6px 8px;
                text-align: center;
            }
            .bom-badge-label {
                font-size: 9px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #8899bb;
                display: block;
                margin-bottom: 2px;
            }
            .bom-badge-value {
                font-size: 18px;
                font-weight: 700;
                color: #4dabf7;
                line-height: 1;
            }
            .bom-empty {
                color: #667799;
                font-style: italic;
                text-align: center;
                padding: 18px 0;
                font-size: 12px;
            }
            /* BOM table — slim columns to fit 340px sidebar */
            .bom-table-wrap {
                overflow-x: auto;
            }
            .bom-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 11px;
                min-width: 0;
            }
            .bom-table th,
            .bom-table td {
                padding: 5px 6px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                white-space: nowrap;
            }
            .bom-table th:first-child,
            .bom-table td:first-child {
                white-space: normal;
                word-break: break-word;
            }
            .bom-table th {
                color: #4dabf7;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 9px;
                position: sticky;
                top: 0;
                background: #16213e;
                z-index: 1;
            }
            .bom-table td { color: #ddd; }
            .bom-table tbody tr {
                cursor: pointer;
                transition: background 0.12s;
            }
            .bom-table tbody tr:hover td {
                background: rgba(77,171,247,0.07);
            }
            .bom-table tbody tr.bom-row-active td {
                background: rgba(77,171,247,0.14);
                color: #fff;
            }
            .bom-table .col-qty {
                text-align: center;
                font-weight: 700;
                color: #fff;
                width: 34px;
            }
            .bom-table .col-group {
                color: #a0b4cc;
                font-size: 10px;
                width: 88px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 88px;
            }
            
            /* Responsive */
            @media (max-width: 1024px) {
                body {
                    grid-template-columns: 280px minmax(0, 1fr);
                }
            }
            @media (max-width: 720px) {
                body {
                    grid-template-columns: 220px minmax(0, 1fr);
                }
                .toolbar-input-group input {
                    width: 58px;
                }
                .component-grid {
                    grid-template-columns: 1fr;
                }
            }
            /* Short viewports: give the inspector less of the sidebar. */
            @media (max-height: 620px) {
                .sidebar {
                    grid-template-rows: minmax(0, 1fr) minmax(120px, 34%);
                }
            }
            
            /* Scrollbar styling */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 255, 255, 0.2);
            }
        </style>
    </head>

    <body>
        <!-- Top Toolbar -->
        <div class="top-toolbar">
            <!-- PCB Dimensions -->
            <div class="toolbar-section">
                <span class="toolbar-section-title">PCB Size</span>
                <div class="toolbar-input-group">
                    <label for="input-width">Width (mm):</label>
                    <input type="number" id="input-width" class="dimension-input" value="100" min="1" step="1" />
                </div>
                <div class="toolbar-input-group">
                    <label for="input-length">Length (mm):</label>
                    <input type="number" id="input-length" class="dimension-input" value="100" min="1" step="1" />
                </div>
            </div>
            
            <!-- Camera / View -->
            <div class="toolbar-section">
                <span class="toolbar-section-title">View</span>
                <div class="toolbar-toggle">
                    <button id="btn-orbit" class="toolbar-btn active" data-view="orbit">Free Orbit</button>
                    <button id="btn-top" class="toolbar-btn" data-view="top">Top View</button>
                    <button id="btn-bottom" class="toolbar-btn" data-view="bottom">Bottom View</button>
                </div>
            </div>
            
            <!-- Tools -->
            <div class="toolbar-section">
                <span class="toolbar-section-title">Tools</span>
                <div class="toolbar-toggle">
                    <button id="btn-select" class="toolbar-btn active" data-tool="select">Select</button>
                    <button id="btn-erase" class="toolbar-btn" data-tool="erase">Eraser</button>
                </div>
            </div>
        </div>

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="components-panel">
                <div class="sidebar-header">
                    <h2>Components</h2>
                </div>
                <input type="text" id="component-search" class="component-search" placeholder="Search components…" />
                <div id="selected-component-banner" class="selected-banner"></div>
                <div class="component-list-wrapper">
                    <div id="component-list"></div>
                </div>
            </div>

            <!-- Inspector/BOM: bottom of left sidebar -->
            <div class="inspector-panel" id="inspector-panel">
                <div class="inspector-header">
                    <div class="inspector-tabs">
                        <button class="inspector-tab active" id="tab-info" onclick="switchTab('info')">⚙ Info</button>
                        <button class="inspector-tab" id="tab-bom" onclick="switchTab('bom')">📋 BOM</button>
                    </div>
                </div>
                <!-- Info pane -->
                <div class="inspector-pane active" id="pane-info">
                    <div class="bom-empty">Select a component from the list</div>
                </div>
                <!-- BOM pane -->
                <div class="inspector-pane" id="pane-bom">
                    <div class="bom-empty">No components placed on the PCB</div>
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <main class="canvas-area" id="canvas-container">
            <canvas id="three-canvas"></canvas>

            <!-- Component Properties Viewer: shown on double-click of a placed
                 component. It is a sibling of the canvas (never inside it), so it
                 does not interfere with the Three.js viewport. -->
            <aside class="props-panel" id="component-props-panel">
                <div class="props-header">
                    <div class="props-title-group">
                        <div class="props-title" id="props-title">Component</div>
                        <div class="props-subtitle" id="props-subtitle"></div>
                    </div>
                    <button
                        type="button"
                        class="props-close"
                        id="props-close"
                        title="Close (Esc)"
                        aria-label="Close component properties"
                    >&times;</button>
                </div>
                <div class="props-body" id="props-body"></div>
            </aside>
        </main>

        <script src="three.min.js"></script>
        <script src="OrbitControls.js"></script>
            
        <script>
            let componentData = [];
            let selectedComponent = null;
            let selectedButtonEl = null;

            const componentListEl = document.getElementById("component-list");
            const componentSearchEl = document.getElementById("component-search");
            const selectedBannerEl = document.getElementById("selected-component-banner");

            fetch("./cmplist.json")
                .then((res) => res.json())
                .then((data) => {
                    // cmplist.json groups items as items: [[{...}, ...]]
                    componentData = data.items.flat().map((c) => ({
                        partname: c.Part_name,
                        group: c["group name"],
                        partNumber: c.Part_number,
                        vendor: c.Vendor,
                        "pcb footprint (width)": Math.max(1, Math.round(parseFloat(c.Json_attr && c.Json_attr["PCB Footprint (Width)"]) || 1)),
                        "pcb footprint (length)": Math.max(1, Math.round(parseFloat(c.Json_attr && c.Json_attr["PCB Footprint (Length)"]) || 1)),
                        "pcb footprint (height)": parseFloat(c.Json_attr && c.Json_attr["PCB Footprint (Height)"]) || 0.4,
                        // Keep the untouched record from cmplist.json. The fields
                        // above are a trimmed view for placement; `raw` holds every
                        // property (Sgp_name, Comp_cd, obj_id, Json_attr, ...) so the
                        // properties viewer can show the complete JSON.
                        raw: c,
                    }));
                    renderComponentList(componentData);
                })
                .catch((err) => {
                    console.error("Failed to load cmplist.json:", err);
                });

            componentSearchEl.addEventListener("input", () => {
                const term = componentSearchEl.value.trim().toLowerCase();
                const filtered = term
                    ? componentData.filter((c) => c.partname.toLowerCase().includes(term))
                    : componentData;
                renderComponentList(filtered);
            });

            function getComponentColor(comp) {
                let hash = 0;
                for (let i = 0; i < comp.partname.length; i++) {
                    hash = comp.partname.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 250;
                const saturation = /active/i.test(comp.group) ? 70 : 40;
                const lightness = /active/i.test(comp.group) ? 55 : 45;
                const hslColor = new THREE.Color(`hsl(${hue}, ${saturation}%, ${lightness}%)`);
                return hslColor.getHex();
            }

            function selectComponent(comp, btnEl) {
                selectedComponent = comp;
                if (selectedButtonEl) selectedButtonEl.classList.remove("selected");
                btnEl.classList.add("selected");
                selectedButtonEl = btnEl;

                selectedBannerEl.classList.add("visible");
                selectedBannerEl.textContent =
                    "Selected: " +
                    comp.partname +
                    " — click the board to place it (" +
                    comp["pcb footprint (width)"] +
                    " × " +
                    comp["pcb footprint (length)"] +
                    " mm)";

                updateInspector();

                // Switch to select tool when picking a component
                if (currentTool === "erase") {
                    setTool("select");
                }
            }

            function renderComponentList(items) {
                componentListEl.innerHTML = "";

                if (items.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "component-empty-msg";
                    empty.textContent = "No components match your search.";
                    componentListEl.appendChild(empty);
                    return;
                }

                const groups = {};
                items.forEach((comp) => {
                    if (!groups[comp.group]) groups[comp.group] = [];
                    groups[comp.group].push(comp);
                });

                Object.keys(groups).forEach((groupName) => {
                    const label = document.createElement("div");
                    label.className = "component-group-label";
                    label.textContent = groupName;
                    componentListEl.appendChild(label);

                    const grid = document.createElement("div");
                    grid.className = "component-grid";

                    groups[groupName].forEach((comp) => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "component-btn";

                        btn.dataset.tooltip =
                            comp["pcb footprint (width)"] +
                            " × " +
                            comp["pcb footprint (length)"] +
                            " × " +
                            comp["pcb footprint (height)"] +
                            " mm";

                        const nameEl = document.createElement("span");
                        nameEl.className = "btn-label";
                        nameEl.textContent = comp.partname;
                        btn.appendChild(nameEl);

                        const sizeEl = document.createElement("span");
                        sizeEl.className = "btn-tooltip";
                        sizeEl.textContent = btn.dataset.tooltip;
                        btn.appendChild(sizeEl);

                        if (selectedComponent && selectedComponent.partname === comp.partname) {
                            btn.classList.add("selected");
                            selectedButtonEl = btn;
                        }

                        btn.addEventListener("click", () => selectComponent(comp, btn));
                        grid.appendChild(btn);
                    });

                    componentListEl.appendChild(grid);
                });
            }

            /* =========================================================
               SCENE / CAMERA / RENDERER SETUP
               ========================================================= */
            const scene = new THREE.Scene();
            const container = document.querySelector("#canvas-container");
            const width = container.clientWidth;
            const height = container.clientHeight;
            const btnTop = document.getElementById("btn-top");
            const btnBottom = document.getElementById("btn-bottom");
            const btnOrbit = document.getElementById("btn-orbit");
            const inputWidth = document.getElementById("input-width");
            const inputLength = document.getElementById("input-length");
            let boardWidth = parseFloat(inputWidth.value);
            let boardLength = parseFloat(inputLength.value);

            /**
             * Calculate the camera Z distance so the board fits in view.
             * Uses the larger board dimension and camera FOV to compute distance.
             */
            function calculateCameraDistance(boardW, boardL) {
                const maxDim = Math.max(boardW, boardL);
                const fovInRadians = (camera.fov * Math.PI) / 180;
                return maxDim / (2 * Math.tan(fovInRadians / 2));
            }

            function updateBoardSize() {
                boardWidth = parseFloat(inputWidth.value);
                boardLength = parseFloat(inputLength.value);
                initializeGridSystem(Math.floor(boardWidth), Math.floor(boardLength));
                pcbBase.geometry.dispose();
                const newBoardGeo = new THREE.BoxGeometry(boardWidth, boardLength, 0.1);
                pcbBase.geometry = newBoardGeo;
                gridGeometry.dispose();
                const newPoints = [];
                const halfW = boardWidth / 2;
                const halfL = boardLength / 2;
                for (let x = -halfW; x <= halfW; x += 1) {
                    newPoints.push(new THREE.Vector3(x, 0, -halfL), new THREE.Vector3(x, 0, halfL));
                }
                for (let z = -halfL; z <= halfL; z += 1) {
                    newPoints.push(new THREE.Vector3(-halfW, 0, z), new THREE.Vector3(halfW, 0, z));
                }
                gridGeometry.setFromPoints(newPoints);
                customTopGrid.position.y = pcbCenterY + thickness / 2 + 0.01;
                customBottomGrid.position.y = pcbCenterY - thickness / 2 - 0.01;

                // Update camera position for current view mode
                updateCameraForCurrentView();
            }
            inputWidth.addEventListener("input", () => { saveState(); updateBoardSize(); });
            inputLength.addEventListener("input", () => { saveState(); updateBoardSize(); });

            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);

            // Initial camera position
            const initialCameraZ = calculateCameraDistance(boardWidth, boardLength);
            camera.position.set(0, initialCameraZ * 1.2, 0);

            const renderer = new THREE.WebGLRenderer({
                canvas: document.querySelector("#three-canvas"),
                antialias: true,
                alpha: true,
            });
            renderer.setSize(container.clientWidth, container.clientHeight);

            window.addEventListener("resize", () => {
                const newwidth = container.clientWidth;
                const newheight = container.clientHeight;
                camera.aspect = newwidth / newheight;
                camera.updateProjectionMatrix();
                renderer.setSize(newwidth, newheight);
            });

            const axishelper = new THREE.AxesHelper(5);
            scene.add(axishelper);
            scene.background = null;

            const boardgeometry = new THREE.BoxGeometry(boardWidth, boardLength, 0.1);

            const ambientlight = new THREE.AmbientLight(0xffffff, 2.2);
            scene.add(ambientlight);
            const directionallight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionallight.position.set(5, 10, 7);
            scene.add(directionallight);

            const topCanvas = document.createElement("canvas");
            const bottomCanvas = document.createElement("canvas");
            topCanvas.width = 512;
            topCanvas.height = 896;
            bottomCanvas.width = 512;
            bottomCanvas.height = 896;
            const ctxTop = topCanvas.getContext("2d");
            const ctxBottom = bottomCanvas.getContext("2d");

            ctxTop.fillStyle = "#004d1a";
            ctxTop.fillRect(0, 0, 512, 896);
            ctxTop.font = "Bold 16px monospace";
            ctxTop.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctxTop.textAlign = "left";
            ctxTop.textBaseline = "top";
            ctxTop.fillText("TOP", 5, 5);

            ctxBottom.fillStyle = "#004d1a";
            ctxBottom.fillRect(0, 0, 512, 896);
            ctxBottom.font = "Bold 16px monospace";
            ctxBottom.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctxBottom.textAlign = "right";
            ctxBottom.textBaseline = "bottom";
            ctxBottom.fillText("BOTTOM", 507, 891);

            const topTexture = new THREE.CanvasTexture(topCanvas);
            const bottomTexture = new THREE.CanvasTexture(bottomCanvas);

            const sideMaterial = new THREE.MeshStandardMaterial({
                color: 0x004d1a,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });
            const topMaterial = new THREE.MeshStandardMaterial({
                map: topTexture,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });
            const bottomMaterial = new THREE.MeshStandardMaterial({
                map: bottomTexture,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });

            const pcbMaterials = [
                sideMaterial,
                sideMaterial,
                sideMaterial,
                sideMaterial,
                topMaterial,
                bottomMaterial,
            ];

            const pcbBase = new THREE.Mesh(boardgeometry, pcbMaterials);
            scene.add(pcbBase);
            pcbBase.rotation.x = -Math.PI / 2;
            pcbBase.position.y = -1;

            // The original "angled" camera roll used for Free Orbit view.
            // Kept as a named constant so we can always restore it.
            const defaultCameraRoll = -Math.PI / 6;
            camera.rotation.z = defaultCameraRoll;

            const controle = new THREE.OrbitControls(camera, renderer.domElement);
            controle.enableDamping = true;
            controle.dampingFactor = 0.4;

            /* =========================================================
               CAMERA VIEW MODES (Top / Bottom / Free Orbit)
               --- BUG FIX: switching to Top/Bottom disabled rotate/pan
               on the controls but Free Orbit never turned them back on.
               ========================================================= */
            let currentViewMode = "orbit"; // "orbit", "top", "bottom"

            /**
             * Update camera position based on current view mode and board size.
             * Call this when board size changes or view mode changes.
             */
            function updateCameraForCurrentView() {
                const cameraZ = calculateCameraDistance(boardWidth, boardLength);

                if (currentViewMode === "top") {
                    camera.position.set(0, cameraZ * 1.2, 0);
                    camera.lookAt(0, 0, 0);
                    camera.rotation.z = 0;
                } else if (currentViewMode === "bottom") {
                    camera.position.set(0, -cameraZ * 1.2, 0);
                    camera.lookAt(0, 0, 0);
                    camera.rotation.z = Math.PI;
                } else {
                    // Free orbit - restore default tilted position
                    camera.position.set(0, cameraZ * 1.2, 0);
                    camera.rotation.z = defaultCameraRoll;
                }
                controle.target.set(0, 0, 0);
                controle.update();
            }

            function activateTopView() {
                currentViewMode = "top";
                controle.enableZoom = true;
                controle.enableRotate = false;
                controle.enablePan = false;
                updateCameraForCurrentView();
                btnTop.classList.add("active");
                btnOrbit.classList.remove("active");
                btnBottom.classList.remove("active");
            }

            function activateBottomView() {
                currentViewMode = "bottom";
                controle.enableZoom = true;
                controle.enableRotate = false;
                controle.enablePan = false;
                updateCameraForCurrentView();
                btnTop.classList.remove("active");
                btnOrbit.classList.remove("active");
                btnBottom.classList.add("active");
            }

            function activateFreeOrbitView() {
                currentViewMode = "orbit";
                controle.enabled = true;
                controle.enableRotate = true;
                controle.enablePan = true;
                controle.enableZoom = true;
                camera.up.set(0, 1, 0);
                updateCameraForCurrentView();
                btnTop.classList.remove("active");
                btnOrbit.classList.add("active");
                btnBottom.classList.remove("active");
            }

            btnTop.addEventListener("click", activateTopView);
            btnBottom.addEventListener("click", activateBottomView);
            btnOrbit.addEventListener("click", activateFreeOrbitView);

            /* =========================================================
               GRID LINES (visual only)
               ========================================================= */
            const gridGeometry = new THREE.BufferGeometry();
            const points = [];
            const halfW = boardgeometry.parameters.width / 2;
            const halfL = boardgeometry.parameters.height / 2;
            const thickness = boardgeometry.parameters.depth;
            const pcbCenterY = pcbBase.position.y;

            for (let x = -halfW; x <= halfW; x += 1) {
                points.push(new THREE.Vector3(x, 0, -halfL), new THREE.Vector3(x, 0, halfL));
            }
            for (let z = -halfL; z <= halfL; z += 1) {
                points.push(new THREE.Vector3(-halfW, 0, z), new THREE.Vector3(halfW, 0, z));
            }
            gridGeometry.setFromPoints(points);

            const gridMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.35,
            });
            const customTopGrid = new THREE.LineSegments(gridGeometry, gridMaterial);
            const customBottomGrid = new THREE.LineSegments(gridGeometry, gridMaterial);
            customTopGrid.position.y = pcbCenterY + thickness / 2 + 0.01;
            customBottomGrid.position.y = pcbCenterY - thickness / 2 - 0.01;
            scene.add(customTopGrid);
            scene.add(customBottomGrid);

            /* =========================================================
               PCB GRID DATABASE (occupancy map, one cell per
               placed component — prevents overlap/out-of-bounds)
               ========================================================= */
            let pcbGrid = [];

            function initializeGridSystem(gw, gl) {
                pcbGrid = [];
                for (let x = 0; x < gw; x++) {
                    pcbGrid[x] = [];
                    for (let z = 0; z < gl; z++) {
                        pcbGrid[x][z] = 0;
                    }
                }
            }
            initializeGridSystem(Math.floor(boardWidth), Math.floor(boardLength));

            function canPlaceComponent(startX, startZ, compWidth, compLength) {
                for (let x = startX; x < startX + compWidth; x++) {
                    for (let z = startZ; z < startZ + compLength; z++) {
                        if (x < 0 || x >= pcbGrid.length || z < 0 || z >= pcbGrid[0].length) {
                            return false;
                        } else if (pcbGrid[x][z] !== 0) {
                            return false;
                        }
                    }
                }
                return true;
            }

            function placeComponent(startX, startZ, compWidth, compLength) {
                if (canPlaceComponent(startX, startZ, compWidth, compLength)) {
                    for (let x = startX; x < startX + compWidth; x++) {
                        for (let z = startZ; z < startZ + compLength; z++) {
                            pcbGrid[x][z] = 1;
                        }
                    }
                    console.log("Component successfully locked into grid database!");
                    return true;
                }
                console.error("Placement rejected: Collision or Out of Bounds!");
                return false;
            }

            function gridToWorld(gridX, gridZ, compWidth, compLength) {
                const worldX = gridX + compWidth / 2 - boardWidth / 2;
                const worldZ = gridZ + compLength / 2 - boardLength / 2;
                return new THREE.Vector3(worldX, pcbBase.position.y + 0.05, worldZ);
            }

            /* =========================================================
               COMPONENT HEIGHT (all components sit on the top face)
               ========================================================= */
            // Y position of a component mesh so it rests on the board surface.
            function getComponentYOffset(meshHeight) {
                return pcbBase.position.y + meshHeight / 2 + 0.02;
            }

            /* =========================================================
               SPAWNING COMPONENTS
               ========================================================= */
            function spawnComponent(gridX, gridZ, compWidth, compLength, colorHex, compHeight) {
                if (!placeComponent(gridX, gridZ, compWidth, compLength)) {
                    return null;
                }
                const meshHeight = typeof compHeight === "number" ? compHeight : 0.4;
                const compGeo = new THREE.BoxGeometry(compWidth, meshHeight, compLength);
                const compMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5 });
                const compMesh = new THREE.Mesh(compGeo, compMat);

                compMesh.userData = {
                    gridX: gridX,
                    gridZ: gridZ,
                    width: compWidth,
                    length: compLength,
                    meshHeight: meshHeight,
                    partname: selectedComponent ? selectedComponent.partname : "Unknown",
                    group: selectedComponent ? selectedComponent.group : "unknown",
                    colorHex: colorHex,
                };

                spawnedComponents.push(compMesh);
                const worldPos = gridToWorld(gridX, gridZ, compWidth, compLength);
                worldPos.y = getComponentYOffset(meshHeight);
                compMesh.position.copy(worldPos);
                scene.add(compMesh);

                // Update BOM inspector
                updateInspector();
                return compMesh;
            }

            /* =========================================================
               TOOLS: Select / Eraser Mode (Toolbar buttons)
               ========================================================= */
            let isEraseMode = false;
            let currentTool = "select"; // "select" or "erase"
            const btnSelect = document.getElementById("btn-select");
            const btnErase = document.getElementById("btn-erase");
            let spawnedComponents = [];
            let inspectedMesh = null; // placed component selected from the BOM

            /* =========================================================
               UNDO / REDO (two simple stacks of JSON snapshots)
               ========================================================= */
            let undoStack = [];
            let redoStack = [];

            // Convert the current board into a JSON string (a frozen snapshot).
            function serialize() {
                return JSON.stringify({
                    width: boardWidth,
                    length: boardLength,
                    components: spawnedComponents.map((m) => ({
                        gridX: m.userData.gridX,
                        gridZ: m.userData.gridZ,
                        width: m.userData.width,
                        length: m.userData.length,
                        meshHeight: m.userData.meshHeight,
                        partname: m.userData.partname,
                        group: m.userData.group,
                        colorHex: m.userData.colorHex,
                    })),
                });
            }

            // Call BEFORE every edit — it snapshots the state we can go back to.
            function saveState() {
                undoStack.push(serialize());
                if (undoStack.length > 50) undoStack.shift();
                redoStack = []; // a new edit clears the redo stack
            }

            // Rebuild the board from a saved JSON snapshot.
            function loadState(json) {
                const data = JSON.parse(json);

                // Remove every existing component mesh
                spawnedComponents.forEach((m) => {
                    scene.remove(m);
                    m.geometry.dispose();
                    m.material.dispose();
                });
                spawnedComponents = [];
                inspectedMesh = null;

                // Restore board size (this also resets pcbGrid)
                inputWidth.value = data.width;
                inputLength.value = data.length;
                updateBoardSize();

                // Re-add each component from the snapshot
                data.components.forEach((c) => {
                    if (!placeComponent(c.gridX, c.gridZ, c.width, c.length)) return;
                    const compGeo = new THREE.BoxGeometry(c.width, c.meshHeight, c.length);
                    const compMat = new THREE.MeshStandardMaterial({ color: c.colorHex, roughness: 0.5 });
                    const compMesh = new THREE.Mesh(compGeo, compMat);
                    compMesh.userData = { ...c };
                    spawnedComponents.push(compMesh);
                    const worldPos = gridToWorld(c.gridX, c.gridZ, c.width, c.length);
                    worldPos.y = getComponentYOffset(c.meshHeight);
                    compMesh.position.copy(worldPos);
                    scene.add(compMesh);
                });

                updateInspector();
            }

            function undo() {
                if (undoStack.length === 0) return;
                redoStack.push(serialize()); // current state goes to redo
                loadState(undoStack.pop());
            }

            function redo() {
                if (redoStack.length === 0) return;
                undoStack.push(serialize()); // current state goes back to undo
                loadState(redoStack.pop());
            }

            function setTool(tool) {
                currentTool = tool;
                isEraseMode = tool === "erase";
                btnSelect.classList.toggle("active", tool === "select");
                btnErase.classList.toggle("active", tool === "erase");
                
                // Update cursor
                renderer.domElement.style.cursor = tool === "erase" ? "crosshair" : "default";
            }

            btnSelect.addEventListener("click", () => setTool("select"));
            btnErase.addEventListener("click", () => setTool("erase"));

            window.addEventListener("keydown", (event) => {
                if (!event.ctrlKey) return;
                if (event.key.toLowerCase() === "z" && !event.shiftKey) {
                    event.preventDefault();
                    undo();
                } else if (event.key.toLowerCase() === "y" || (event.key.toLowerCase() === "z" && event.shiftKey)) {
                    event.preventDefault();
                    redo();
                }
            });

            /* =========================================================
               DRAG-AND-DROP FOR ALREADY-SPAWNED COMPONENTS
               - Orbit is disabled the instant a component is grabbed and
                 re-enabled on drop, so the camera stays perfectly steady.
               ========================================================= */
            let isDragging = false;
            let draggedMesh = null;
            let suppressNextClick = false;

            function getPointerNDC(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                return new THREE.Vector2(
                    ((event.clientX - rect.left) / rect.width) * 2 - 1,
                    -((event.clientY - rect.top) / rect.height) * 2 + 1,
                );
            }

            function freeGridCells(info) {
                for (let x = info.gridX; x < info.gridX + info.width; x++) {
                    for (let z = info.gridZ; z < info.gridZ + info.length; z++) {
                        pcbGrid[x][z] = 0;
                    }
                }
            }

            function startComponentDrag(event) {
                if (isEraseMode) return; // erase mode keeps its own click flow

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(getPointerNDC(event), camera);
                const hits = raycaster.intersectObjects(spawnedComponents);
                if (hits.length === 0) return;

                draggedMesh = hits[0].object;
                saveState(); // remember position before the move
                isDragging = true;
                suppressNextClick = true;

                freeGridCells(draggedMesh.userData);

                controle.enabled = false; // orbit becomes steady while dragging
                draggedMesh.material.emissive.set(0x225533);
                renderer.domElement.style.cursor = "grabbing";
                renderer.domElement.setPointerCapture(event.pointerId);
                event.preventDefault();
            }

            function updateComponentDrag(event) {
                if (!isDragging || !draggedMesh) return;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(getPointerNDC(event), camera);
                const hit = raycaster.intersectObject(pcbBase);
                if (hit.length === 0) return;

                const currentWidth = parseFloat(inputWidth.value);
                const currentLength = parseFloat(inputLength.value);
                const localX = hit[0].point.x + currentWidth / 2;
                const localZ = hit[0].point.z + currentLength / 2;
                const gridX = Math.floor(localX);
                const gridZ = Math.floor(localZ);

                const info = draggedMesh.userData;
                if (canPlaceComponent(gridX, gridZ, info.width, info.length)) {
                    const worldPos = gridToWorld(gridX, gridZ, info.width, info.length);
                    worldPos.y = getComponentYOffset(info.meshHeight);
                    draggedMesh.position.copy(worldPos);
                    info.gridX = gridX;
                    info.gridZ = gridZ;
                }
                // Off-board or overlapping cells are simply ignored — the
                // component stays snapped at its last valid position.
            }

            function endComponentDrag(event) {
                if (!isDragging || !draggedMesh) return;

                const info = draggedMesh.userData;
                placeComponent(info.gridX, info.gridZ, info.width, info.length);
                draggedMesh.material.emissive.set(0x000000);

                if (renderer.domElement.hasPointerCapture(event.pointerId)) {
                    renderer.domElement.releasePointerCapture(event.pointerId);
                }

                isDragging = false;
                draggedMesh = null;
                controle.enabled = true; // orbit re-enabled after drop
                renderer.domElement.style.cursor = currentTool === "erase" ? "crosshair" : "default";
            }

            renderer.domElement.addEventListener("pointerdown", startComponentDrag);
            renderer.domElement.addEventListener("pointermove", updateComponentDrag);
            renderer.domElement.addEventListener("pointerup", endComponentDrag);

            /* =========================================================
               INSPECTOR / BOM PANEL — Tab switching
               ========================================================= */
            const paneInfo = document.getElementById("pane-info");
            const paneBom  = document.getElementById("pane-bom");
            const tabInfo  = document.getElementById("tab-info");
            const tabBom   = document.getElementById("tab-bom");
            let activeTab  = "info";

            function switchTab(tab) {
                activeTab = tab;
                tabInfo.classList.toggle("active", tab === "info");
                tabBom.classList.toggle("active",  tab === "bom");
                paneInfo.classList.toggle("active", tab === "info");
                paneBom.classList.toggle("active",  tab === "bom");
            }

            /* =========================================================
               BILL OF MATERIALS
               ========================================================= */

            function findComponentDetails(partname) {
                return componentData.find((c) => c.partname === partname) || null;
            }

            function generateBillOfMaterials() {
                const groups = new Map();
                spawnedComponents.forEach((mesh) => {
                    const info = mesh.userData;
                    const key  = info.partname;
                    if (!groups.has(key)) {
                        groups.set(key, {
                            partname: info.partname,
                            group:    info.group || "N/A",
                            quantity: 0,
                            details:  findComponentDetails(info.partname),
                        });
                    }
                    groups.get(key).quantity += 1;
                });
                return Array.from(groups.values());
            }

            // Highlight one placed component on the PCB
            function inspectPlacedComponent(mesh) {
                inspectedMesh = mesh || null;
                spawnedComponents.forEach((m) => {
                    if (m.material.emissive) {
                        m.material.emissive.set(m === inspectedMesh ? 0x224488 : 0x000000);
                    }
                });
                updateInspector();
            }

            /* --- Info pane renderer --- */
            function renderInfoPane(comp) {
                if (!comp) {
                    paneInfo.innerHTML = '<div class="bom-empty">Select a component from the list</div>';
                    return;
                }
                const rows = [
                    ["Part",   comp.partname],
                    ["Group",  comp.group],
                    ["Width",  comp["pcb footprint (width)"]  !== undefined ? comp["pcb footprint (width)"]  + " mm" : "—"],
                    ["Length", comp["pcb footprint (length)"] !== undefined ? comp["pcb footprint (length)"] + " mm" : "—"],
                    ["Height", comp["pcb footprint (height)"] !== undefined ? comp["pcb footprint (height)"] + " mm" : "—"],
                ];
                paneInfo.innerHTML = rows.map(([k, v]) =>
                    `<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`
                ).join("");
            }

            /* --- BOM pane renderer --- */
            function renderBomPane() {
                const bom = generateBillOfMaterials();

                if (bom.length === 0) {
                    paneBom.innerHTML = '<div class="bom-empty">No components placed on the PCB</div>';
                    return;
                }

                let html = `
                    <div class="bom-badges">
                        <div class="bom-badge">
                            <span class="bom-badge-label">Total</span>
                            <span class="bom-badge-value">${spawnedComponents.length}</span>
                        </div>
                        <div class="bom-badge">
                            <span class="bom-badge-label">Unique</span>
                            <span class="bom-badge-value">${bom.length}</span>
                        </div>
                    </div>
                    <div class="bom-table-wrap">
                    <table class="bom-table">
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th class="col-group">Group</th>
                                <th class="col-qty">Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                bom.forEach((entry) => {
                    const isActive = inspectedMesh &&
                        inspectedMesh.userData.partname === entry.partname;
                    html += `
                        <tr class="bom-row${isActive ? " bom-row-active" : ""}"
                            data-partname="${entry.partname}">
                            <td>${entry.partname}</td>
                            <td class="col-group" title="${entry.group}">${entry.group}</td>
                            <td class="col-qty">${entry.quantity}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div>`;
                paneBom.innerHTML = html;

                // Row click → highlight on PCB & switch to info pane
                paneBom.querySelectorAll(".bom-row").forEach((row) => {
                    row.addEventListener("click", () => {
                        const mesh = spawnedComponents.find(
                            (m) => m.userData.partname === row.dataset.partname
                        );
                        if (mesh) {
                            inspectPlacedComponent(mesh);
                            switchTab("info");
                        }
                    });
                });
            }

            /* --- Master update function --- */
            function updateInspector() {
                // Sync inspectedMesh validity
                if (inspectedMesh && spawnedComponents.indexOf(inspectedMesh) === -1) {
                    inspectedMesh = null;
                }

                // Info pane: show inspected placed-component OR selected library component
                const infoComp = inspectedMesh
                    ? findComponentDetails(inspectedMesh.userData.partname)
                    : selectedComponent;
                renderInfoPane(infoComp);

                // BOM pane always refreshes
                renderBomPane();

                // Auto-switch to BOM tab when a component is placed (BOM non-empty)
                if (spawnedComponents.length > 0 && activeTab === "info" && !selectedComponent && !inspectedMesh) {
                    switchTab("bom");
                }
            }

            /* =========================================================
               CLICK: spawn a new component (or erase one)
               ========================================================= */
            document.querySelector("#three-canvas").addEventListener("click", (event) => {
                if (suppressNextClick) {
                    suppressNextClick = false;
                    return;
                }

                const rect = renderer.domElement.getBoundingClientRect();
                const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);

                if (currentTool === "erase") {
                    const intersects = raycaster.intersectObjects(spawnedComponents);
                    if (intersects.length > 0) {
                        const clickedComponent = intersects[0].object;
                        saveState();
                        freeGridCells(clickedComponent.userData);
                        scene.remove(clickedComponent);
                        clickedComponent.geometry.dispose();
                        clickedComponent.material.dispose();
                        spawnedComponents = spawnedComponents.filter((mesh) => mesh !== clickedComponent);
                        console.log("Component vaporized and database space cleared!");
                        updateInspector();
                    }
                } else {
                    if (!selectedComponent) {
                        console.warn("No component selected — pick one from the Components list first.");
                        return;
                    }
                    const intersects = raycaster.intersectObject(pcbBase);
                    if (intersects.length > 0) {
                        const hitPoint = intersects[0].point;
                        const currentWidth = parseFloat(inputWidth.value);
                        const currentLength = parseFloat(inputLength.value);
                        const localX = hitPoint.x + currentWidth / 2;
                        const localZ = hitPoint.z + currentLength / 2;
                        const gridX = Math.floor(localX);
                        const gridZ = Math.floor(localZ);

                        const compWidth = selectedComponent["pcb footprint (width)"];
                        const compLength = selectedComponent["pcb footprint (length)"];
                        const compHeight = selectedComponent["pcb footprint (height)"];
                        const colorHex = getComponentColor(selectedComponent);

                        saveState();
                        const placed = spawnComponent(gridX, gridZ, compWidth, compLength, colorHex, compHeight);
                        if (!placed) undoStack.pop(); // placement was rejected, discard the snapshot
                        else lastPlaceTime = Date.now();
                    }
                }
            });

            /* =========================================================
               COMPONENT PROPERTIES VIEWER
               Double-click a placed component to inspect it.
               ========================================================= */
            const propsPanelEl = document.getElementById("component-props-panel");
            const propsTitleEl = document.getElementById("props-title");
            const propsSubtitleEl = document.getElementById("props-subtitle");
            const propsBodyEl = document.getElementById("props-body");
            const propsCloseEl = document.getElementById("props-close");

            // Remembers when the last component was placed, so a double-click
            // that just created a component is not treated as "inspect this".
            let lastPlaceTime = 0;

            // Makes any value safe to inject into innerHTML.
            function escapeHTML(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            // Pretty-prints any JSON value — objects, arrays and primitives
            // all come back indented so nesting is easy to read.
            function formatComponentJSON(value, indent) {
                const spaces = typeof indent === "number" ? indent : 4;
                try {
                    const text = JSON.stringify(value, null, spaces);
                    return text === undefined ? String(value) : text;
                } catch (err) {
                    return "/* Could not format this data: " + err.message + " */";
                }
            }

            // Builds one "label : value" row.
            function buildPropertyRow(key, value, isNested) {
                let shown;
                if (value === null) shown = "null";
                else if (value === undefined) shown = "—";
                else if (typeof value === "object") shown = JSON.stringify(value);
                else shown = String(value);

                return (
                    '<div class="props-row' + (isNested ? " props-row-nested" : "") + '">' +
                    '<span class="props-key">' + escapeHTML(key) + "</span>" +
                    '<span class="props-val">' + escapeHTML(shown) + "</span>" +
                    "</div>"
                );
            }

            // Builds a label-only row for a nested object or array, so the
            // container's own name (e.g. "Json_attr") is never lost — only its
            // children are indented underneath it.
            function buildGroupRow(key) {
                return (
                    '<div class="props-row props-row-group">' +
                    '<span class="props-key">' + escapeHTML(key) + "</span>" +
                    "</div>"
                );
            }

            /* Turns a JSON value into readable rows. Objects and arrays get a
               label row plus indented children, so nested data is shown rather
               than hidden behind a collapsed string. */
            function buildPropertyRows(value, depth, keyName) {
                const isNested = depth > 0;

                if (value !== null && typeof value === "object") {
                    const keys = Object.keys(value);
                    const isArray = Array.isArray(value);

                    // Top level has no name of its own; nested ones do.
                    let html = isNested ? buildGroupRow(keyName) : "";

                    return (
                        html +
                        keys
                            .map((key) => {
                                // Array children read as parent[0], parent[1], ...
                                // Object children are shown by their own key,
                                // since the group row above already names them.
                                const childName = isArray ? keyName + "[" + key + "]" : key;
                                return buildPropertyRows(value[key], depth + 1, childName);
                            })
                            .join("")
                    );
                }

                return buildPropertyRow(keyName, value, isNested);
            }

            /* Fills the panel with every property of a placed component and
               shows it. `mesh` is the Three.js mesh that was clicked. */
            function showComponentProperties(mesh) {
                if (!mesh) return;

                /* Use the complete original record from cmplist.json. The library
                   entry keeps it on `.raw`; if that lookup fails we fall back to
                   the trimmed entry, then to the data on the mesh itself. */
                const libraryEntry = findComponentDetails(mesh.userData.partname);
                const record = (libraryEntry && libraryEntry.raw) || libraryEntry || mesh.userData;

                // Header label + reference, both read straight from the data.
                const displayName = record.Part_name || mesh.userData.partname || "Component";
                const reference = record.Part_number || "";
                propsTitleEl.textContent = displayName;
                propsSubtitleEl.textContent = reference ? "Ref: " + reference : "";

                // Section 1 — every property, nested objects/arrays expanded.
                let html = '<div class="props-section-title">Properties</div>';
                html += buildPropertyRows(record, 0, "value");

                // Section 2 — where this instance actually sits on the board.
                html += '<div class="props-section-title">Placement</div>';
                html += buildPropertyRow("Grid X", mesh.userData.gridX + " mm", false);
                html += buildPropertyRow("Grid Z", mesh.userData.gridZ + " mm", false);
                html += buildPropertyRow("Width", mesh.userData.width + " mm", false);
                html += buildPropertyRow("Length", mesh.userData.length + " mm", false);
                html += buildPropertyRow("Height", mesh.userData.meshHeight + " mm", false);

                // Section 3 — the complete JSON, properly indented.
                html += '<div class="props-section-title">Raw JSON</div>';
                html += '<pre class="props-json">' + escapeHTML(formatComponentJSON(record)) + "</pre>";

                propsBodyEl.innerHTML = html;
                propsBodyEl.scrollTop = 0;
                propsPanelEl.classList.add("visible");
            }

            // Hides the properties panel.
            function closeComponentProperties() {
                propsPanelEl.classList.remove("visible");
            }

            /* Raycasts the click against placed components only. Because the
               bare PCB is never in `spawnedComponents`, a double-click on empty
               board space finds no hit and simply closes the panel. */
            function handleComponentDoubleClick(event) {
                // A double-click on empty space that just placed a component is
                // a placement, not an inspection request.
                if (Date.now() - lastPlaceTime < 400) {
                    closeComponentProperties();
                    return;
                }

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(getPointerNDC(event), camera);

                const hits = raycaster.intersectObjects(spawnedComponents, false);
                if (hits.length === 0) {
                    closeComponentProperties();
                    return;
                }

                showComponentProperties(hits[0].object);
            }

            renderer.domElement.addEventListener("dblclick", handleComponentDoubleClick);
            propsCloseEl.addEventListener("click", closeComponentProperties);

            // Escape closes the panel.
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape") closeComponentProperties();
            });

            function animate() {
                requestAnimationFrame(animate);
                controle.update();
                renderer.render(scene, camera);
            }
            animate();

            // Initialize inspector
            updateInspector();
            switchTab("info");
        </script>
    </body>
</html>
