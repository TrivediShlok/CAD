<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PCB Circuit Designer</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: #1a1a2e;
                color: #eaeaea;
                height: 100vh;
                overflow: hidden;
                display: grid;
                grid-template-columns: 340px minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
            }
            .top-toolbar {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 20px;
                background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
                border-bottom: 1px solid #0f3460;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
                flex-wrap: wrap;
                row-gap: 10px;
                z-index: 100;
            }
             
            .toolbar-section {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }
            .toolbar-section:last-child {
                border-right: none;
                padding-right: 0;
            }
            .toolbar-section:first-child {
                padding-left: 0;
            }
            @media (max-width: 900px) {
                .toolbar-section {
                    border-right: none;
                    padding: 0;
                }
            }
            .toolbar-section-title {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #8899bb;
                font-weight: 600;
                margin-right: 8px;
            }
            
            .toolbar-input-group {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .toolbar-input-group label {
                font-size: 12px;
                color: #ccc;
                white-space: nowrap;
            }
            .toolbar-input-group input {
                width: 70px;
                padding: 6px 10px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #fff;
                font-size: 13px;
                outline: none;
            }
            .toolbar-input-group input:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }
            
            .toolbar-btn {
                padding: 8px 14px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #eaeaea;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            .toolbar-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .toolbar-btn.active {
                background: #4dabf7;
                border-color: #4dabf7;
                color: #1a1a2e;
                font-weight: 600;
            }
            .toolbar-btn.active:hover {
                background: #74c0fc;
            }
            
            .toolbar-toggle {
                display: flex;
                border-radius: 4px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
            .toolbar-toggle .toolbar-btn {
                border-radius: 0;
                border: none;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }
            .toolbar-toggle .toolbar-btn:last-child {
                border-right: none;
            }
            
            .sidebar {
                grid-column: 1;
                grid-row: 2;
                min-height: 0;
                min-width: 0;
                display: grid;
                 
                grid-template-rows: minmax(0, 1fr) minmax(140px, 40%);
                background: #16213e;
                border-right: 1px solid #0f3460;
                overflow: hidden;
            }

            .components-panel {
                min-height: 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .sidebar-header {
                padding: 14px 16px;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.2);
            }
            .sidebar-header h2 {
                font-size: 14px;
                font-weight: 600;
                color: #fff;
                letter-spacing: 0.3px;
            }
            .component-search {
                width: calc(100% - 32px);
                padding: 10px 12px;
                margin: 12px 16px 0;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: #131313;
                font-weight: 600;
                font-size: 13px;
                outline: none;
            }
            .component-search:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }
            .component-search::placeholder {
                color: #667799;
            }
            .filter-row {
                position: relative;
                width: calc(100% - 32px);
                margin: 8px 16px 0;
            }
            .ms-select {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 12px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: #eaeaea;
                font-weight: 600;
                font-size: 13px;
                text-align: left;
                cursor: pointer;
                transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            }
            .ms-select:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.2);
            }
            .ms-select.open {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }
            .ms-select.active {
                border-color: rgba(77, 171, 247, 0.55);
                color: #a5d6f7;
            }
            .ms-select .ms-caret {
                flex: none;
                color: #7f93b8;
                font-size: 10px;
            }
            .ms-select .ms-count-badge {
                flex: none;
                padding: 1px 7px;
                border-radius: 999px;
                background: rgba(77, 171, 247, 0.22);
                border: 1px solid rgba(77, 171, 247, 0.4);
                color: #a5d6f7;
                font-size: 10px;
                font-weight: 700;
            }
            .ms-menu {
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                right: 0;
                z-index: 30;
                max-height: 220px;
                overflow-y: auto;
                padding: 4px;
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 6px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            }
            .ms-menu[hidden] {
                display: none;
            }
            .ms-actions {
                display: flex;
                gap: 6px;
                padding: 4px 4px 6px;
                margin-bottom: 4px;
                border-bottom: 1px solid rgba(127, 147, 184, 0.2);
            }
            .ms-action-btn {
                flex: 1;
                padding: 5px 6px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                color: #cfd8ea;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.15s ease, color 0.15s ease;
            }
            .ms-action-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                color: #fff;
            }
            .ms-option {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 8px;
                background: none;
                border: none;
                border-radius: 4px;
                color: #eaeaea;
                font-size: 12px;
                text-align: left;
                cursor: pointer;
                transition: background 0.12s ease;
            }
            .ms-option:hover {
                background: rgba(255, 255, 255, 0.08);
            }
            .ms-option.selected {
                background: rgba(77, 171, 247, 0.12);
            }
            .ms-option:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .ms-option .ms-check {
                flex: none;
                width: 12px;
                color: #4dabf7;
                font-weight: 700;
            }
            .ms-option .ms-name {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .ms-option .ms-count {
                flex: none;
                color: #7f93b8;
                font-size: 10px;
                font-variant-numeric: tabular-nums;
            }
            .ms-option .ms-count.zero {
                color: #5a6b8c;
            }
             
            .selected-banner,
            #selected-component-banner {
                width: calc(100% - 32px);
                margin: 10px 16px 0;
                padding: 10px 12px;
                background: rgba(76, 175, 80, 0.15);
                border: 1px solid rgba(76, 175, 80, 0.35);
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.4;
                color: #a5d6a7;
                display: none;
            }
            .selected-banner.visible {
                display: block;
            }
            .component-list-wrapper {
                flex: 1;
                overflow-y: auto;
                padding: 8px 16px 16px;
            }
             
            .component-group-label {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #7f93b8;
                background: none;
                padding: 10px 10px 6px;
                margin: 12px 0 0;
                border-radius: 0;
                border-bottom: 1px solid rgba(127, 147, 184, 0.2);
            }
            .component-group-label:first-child {
                margin-top: 0;
            }
            .component-group-label.filterable {
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
                transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
            }
            .component-group-label.filterable:hover {
                color: #cfe0ff;
                background: rgba(255, 255, 255, 0.05);
            }
            .component-group-label.active {
                color: #4dabf7;
                border-bottom-color: rgba(77, 171, 247, 0.6);
            }
            .component-group-label.empty {
                opacity: 0.4;
            }
            .component-group-label .gl-count {
                float: right;
                font-size: 9px;
                letter-spacing: 0;
                text-transform: none;
                color: #7f93b8;
                font-variant-numeric: tabular-nums;
            }
            .component-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .component-btn {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
                padding: 9px 10px;
                min-height: 46px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #eaeaea;
                font-size: 12px;
                line-height: 1.35;
                text-align: left;
                cursor: pointer;
                transition: all 0.15s ease;
            }
            .component-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-1px);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            }
            .component-btn.selected {
                background: rgba(76, 175, 80, 0.2);
                border-color: #4caf50;
                box-shadow: 0 0 0 1px #4caf50;
            }
             
            .component-btn::before,
            .component-btn::after {
                content: none;
            }
            .component-btn .btn-label {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                width: 100%;
            }
            .component-btn .btn-tooltip {
                font-size: 10px;
                color: #7f93b8;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
                margin-top: 0;
            }
            .component-btn.selected .btn-tooltip {
                color: #a5d6a7;
            }
             
            .component-empty-msg {
                color: #8899bb;
                font-size: 12px;
                font-style: italic;
                text-align: center;
                padding: 24px 8px;
                line-height: 1.5;
            }
            
            .canvas-area {
                grid-column: 2;
                grid-row: 2;
                min-width: 0;
                min-height: 0;
                position: relative;
                overflow: hidden;
                background: radial-gradient(ellipse at center, #1a1a3e 0%, #0d0d1a 100%);
            }
            #three-canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .props-panel {
                position: absolute;
                top: 16px;
                right: 16px;
                bottom: 16px;
                width: 340px;
                max-width: calc(100% - 32px);
                display: none;
                flex-direction: column;
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 8px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
                overflow: hidden;
                z-index: 10;
            }
            .props-panel.visible {
                display: flex;
            }
            .props-header {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 14px;
                background: rgba(0, 0, 0, 0.25);
                border-bottom: 1px solid #0f3460;
                flex-shrink: 0;
            }
            .props-title-group {
                flex: 1;
                min-width: 0;
            }
            .props-title {
                font-size: 13px;
                font-weight: 700;
                color: #fff;
                line-height: 1.3;
                word-break: break-word;
            }
            .props-subtitle {
                font-size: 10px;
                color: #8899bb;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                margin-top: 3px;
                word-break: break-word;
            }
            .props-subtitle:empty {
                display: none;
            }
            .props-close {
                flex-shrink: 0;
                width: 26px;
                height: 26px;
                padding: 0;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 5px;
                color: #eaeaea;
                font-size: 17px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.15s ease, border-color 0.15s ease;
            }
            .props-close:hover {
                background: rgba(255, 90, 90, 0.25);
                border-color: rgba(255, 90, 90, 0.5);
                color: #fff;
            }
             
            .props-body {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 12px 14px 16px;
            }
            .props-section-title {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: #4dabf7;
                margin: 16px 0 7px;
                padding-bottom: 4px;
                border-bottom: 1px solid rgba(77, 171, 247, 0.2);
            }
            .props-section-title:first-child {
                margin-top: 0;
            }
            .props-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10px;
                padding: 4px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 11px;
            }
             
            .props-row-nested {
                padding-left: 14px;
            }
             
            .props-row-group {
                justify-content: flex-start;
                padding-bottom: 2px;
                border-bottom: none;
            }
            .props-row-group .props-key {
                max-width: 100%;
                color: #cce;
                font-weight: 700;
                margin-top: 4px;
            }
            .props-key {
                color: #8899bb;
                flex-shrink: 1;
                max-width: 52%;
                word-break: break-word;
            }
            .props-val {
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }
            .props-json {
                margin: 0;
                padding: 10px;
                background: rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #9fe0b0;
                font-family: Consolas, Menlo, "Courier New", monospace;
                font-size: 11px;
                line-height: 1.5;
                 
                white-space: pre;
                overflow-x: auto;
            }

            .status-toast {
                position: fixed;
                max-width: min(520px, calc(100vw - 32px));
                padding: 11px 18px;
                background: #16213e;
                border: 1px solid #4dabf7;
                border-radius: 8px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
                color: #eaeaea;
                font-size: 12.5px;
                line-height: 1.45;
                text-align: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, transform 0.2s ease;
                z-index: 50;
            }
            /* Import / export messages stay bottom-centre. */
            #status-toast {
                left: 50%;
                bottom: 24px;
                transform: translate(-50%, 20px);
            }
            #status-toast.visible {
                transform: translate(-50%, 0);
            }
            /* Placement errors appear bottom-right, away from the PCB centre. */
            #placement-toast {
                right: 16px;
                bottom: 16px;
                transform: translateY(20px);
                text-align: left;
                max-width: min(420px, calc(100vw - 32px));
                font-weight: 500;
            }
            #placement-toast.visible {
                transform: translateY(0);
            }
            .status-toast.visible {
                opacity: 1;
            }
            .status-toast.toast-error {
                border-color: #ff6b6b;
                color: #ffc9c9;
            }
            .status-toast.toast-success {
                border-color: #4caf50;
                color: #c8e6c9;
            }
            
            .inspector-panel {
                height: 100%;
                min-height: 0;
                background: #16213e;
                border-top: 2px solid #0f3460;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .inspector-header {
                padding: 0;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.25);
                flex-shrink: 0;
            }
             
            .inspector-tabs {
                display: flex;
                align-items: stretch;
            }
            .inspector-tab {
                flex: 1;
                padding: 10px 8px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                cursor: pointer;
                transition: color 0.15s, border-color 0.15s, background 0.15s;
                text-align: center;
            }
            .inspector-tab:hover {
                color: #cce;
                background: rgba(255,255,255,0.04);
            }
            .inspector-tab.active {
                color: #4dabf7;
                border-bottom-color: #4dabf7;
                background: rgba(77,171,247,0.06);
            }
             
            .inspector-pane {
                display: none;
            }
            .inspector-pane.active {
                 
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 10px 14px 12px;
                font-size: 12px;
                color: #bbb;
            }
             
            .info-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding: 5px 0;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                gap: 8px;
            }
            .info-row:last-child { border-bottom: none; }
            .info-key {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                flex-shrink: 0;
            }
            .info-val {
                font-size: 12px;
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }
             
            .bom-badges {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }
            .bom-badge {
                flex: 1;
                background: rgba(77,171,247,0.1);
                border: 1px solid rgba(77,171,247,0.2);
                border-radius: 6px;
                padding: 6px 8px;
                text-align: center;
            }
            .bom-badge-label {
                font-size: 9px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #8899bb;
                display: block;
                margin-bottom: 2px;
            }
            .bom-badge-value {
                font-size: 18px;
                font-weight: 700;
                color: #4dabf7;
                line-height: 1;
            }
            .bom-empty {
                color: #667799;
                font-style: italic;
                text-align: center;
                padding: 18px 0;
                font-size: 12px;
            }
             
            .bom-table-wrap {
                overflow-x: auto;
            }
            .bom-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 11px;
                min-width: 0;
            }
            .bom-table th,
            .bom-table td {
                padding: 5px 6px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                white-space: nowrap;
            }
            .bom-table th:first-child,
            .bom-table td:first-child {
                white-space: normal;
                word-break: break-word;
            }
            .bom-table th {
                color: #4dabf7;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-size: 9px;
                position: sticky;
                top: 0;
                background: #16213e;
                z-index: 1;
            }
            .bom-table td { color: #ddd; }
            .bom-table tbody tr {
                cursor: pointer;
                transition: background 0.12s;
            }
            .bom-table tbody tr:hover td {
                background: rgba(77,171,247,0.07);
            }
            .bom-table tbody tr.bom-row-active td {
                background: rgba(77,171,247,0.14);
                color: #fff;
            }
            .bom-table .col-qty {
                text-align: center;
                font-weight: 700;
                color: #fff;
                width: 34px;
            }
            .bom-table .col-group {
                color: #a0b4cc;
                font-size: 10px;
                width: 88px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 88px;
            }
            
            @media (max-width: 1024px) {
                body {
                    grid-template-columns: 280px minmax(0, 1fr);
                }
            }
            @media (max-width: 720px) {
                body {
                    grid-template-columns: 220px minmax(0, 1fr);
                }
                .toolbar-input-group input {
                    width: 58px;
                }

</style>

        <div class="status-toast" id="status-toast"></div>
        <div class="status-toast" id="placement-toast"></div>

        <script src="three.min.js"></script>
        <script src="OrbitControls.js"></script>

        <script>
            let componentData = [];
            let selectedComponent = null;
            let selectedButtonEl = null;
            const componentListEl = document.getElementById("component-list");
            const componentSearchEl = document.getElementById("component-search");
            const selectedBannerEl = document.getElementById("selected-component-banner");
            const sgpFilterBtnEl = document.getElementById("sgp-filter-btn");
            const sgpFilterLabelEl = document.getElementById("sgp-filter-label");
            const sgpFilterMenuEl = document.getElementById("sgp-filter-menu");
            function extractComponentRecords(data) {
                if (Array.isArray(data)) return data;
                if (data && Array.isArray(data.items)) return data.items.flat();
                if (data && Array.isArray(data.components)) return data.components.flat();
                return [];
            }
            function firstDefined(record, names) {
                if (!record) return undefined;
                for (const name of names) {
                    if (record[name] !== undefined && record[name] !== null) return record[name];
                }
                return undefined;
            }
            function readFootprint(attr, key) {
                const value = firstDefined(attr, ["PCB Footprint (" + key + ")", "pcb footprint (" + key + ")"]);
                const num = parseFloat(value);
                return isFinite(num) ? num : null;
            }
            function normalizeComponent(raw) {
                const attr = firstDefined(raw, ["json_attr", "Json_attr"]) || {};
                const width = readFootprint(attr, "Width");
                const length = readFootprint(attr, "Length");
                const height = readFootprint(attr, "Height");
                return {
                    partname: firstDefined(raw, ["part_name", "Part_name", "name"]) || "Unknown",
                    group: firstDefined(raw, ["group_name", "group name"]) || "N/A",
                    partNumber: firstDefined(raw, ["part_number", "Part_number"]) || "",
                    vendor: firstDefined(raw, ["vendor", "Vendor"]) || "",
                    sgpName: firstDefined(raw, ["sgp_name", "Sgp_name"]) || "",
                    "pcb footprint (width)": width === null ? 1 : Math.max(1, Math.round(width)),
                    "pcb footprint (length)": length === null ? 1 : Math.max(1, Math.round(length)),
                    "pcb footprint (height)": height === null ? 0.4 : height,
                    raw: raw,
                };
            }
            function renderComponentLoadError(message) {
                componentListEl.innerHTML =
                    '<div class="component-empty-msg">' + escapeHTML(message) + "</div>";
            }
            fetch("./cmplist.json")
                .then((res) => {
                    if (!res.ok) throw new Error("server replied " + res.status);
                    return res.json();
                })
                .then((data) => {
                    const records = extractComponentRecords(data);
                    if (records.length === 0) {
                        throw new Error("no component records found in the file");
                    }
                    componentData = records.map(normalizeComponent);
                    applyFilters();
                })
                .catch((err) => {
                    console.error("Failed to load cmplist.json:", err);
                    componentData = [];
                    renderComponentLoadError(
                        "Could not load the component library. Check that cmplist.json sits next to index.html and is valid JSON."
                    );
                    showStatusToast("Component library failed to load — " + err.message, "error");
                });
            const filterState = { term: "", groups: new Set(), sgps: new Set() };
            function matchesTerm(comp) {
                return !filterState.term || comp.partname.toLowerCase().indexOf(filterState.term) !== -1;
            }
            function matchesSgp(comp) {
                return filterState.sgps.size === 0 || filterState.sgps.has(comp.sgpName);
            }
            function matchesGroup(comp) {
                return filterState.groups.size === 0 || filterState.groups.has(comp.group);
            }
            function getFilteredComponents() {
                return componentData.filter((c) => matchesTerm(c) && matchesSgp(c) && matchesGroup(c));
            }
            function getCandidateComponents() {
                return componentData.filter((c) => matchesTerm(c) && matchesSgp(c));
            }
            function applyFilters() {
                syncSgpFilterButton();
                renderComponentList(getFilteredComponents(), getCandidateComponents());
            }
            componentSearchEl.addEventListener("input", () => {
                filterState.term = componentSearchEl.value.trim().toLowerCase();
                applyFilters();
            });
            function syncSgpFilterButton() {
                const n = filterState.sgps.size;
                sgpFilterLabelEl.textContent =
                    n === 0 ? "All sub-groups" : n === 1 ? "1 selected" : n + " selected";
                sgpFilterBtnEl.classList.toggle("active", n > 0);
            }
            function toggleSgp(name) {
                if (filterState.sgps.has(name)) filterState.sgps.delete(name);
                else filterState.sgps.add(name);
                applyFilters();
            }
            function setSgpMenuOpen(open) {
                sgpFilterBtnEl.classList.toggle("open", open);
                sgpFilterBtnEl.setAttribute("aria-expanded", open ? "true" : "false");
                sgpFilterMenuEl.hidden = !open;
            }
            function refreshSgpFilterMenu() {
                const totals = new Map();
                const counts = new Map();
                componentData.forEach((comp) => {
                    totals.set(comp.sgpName, (totals.get(comp.sgpName) || 0) + 1);
                });
                componentData
                    .filter((c) => matchesTerm(c) && matchesGroup(c))
                    .forEach((comp) => counts.set(comp.sgpName, (counts.get(comp.sgpName) || 0) + 1));
                Array.from(filterState.sgps).forEach((name) => {
                    if (!totals.has(name)) filterState.sgps.delete(name);
                });
                const scrollTop = sgpFilterMenuEl.scrollTop;
                sgpFilterMenuEl.innerHTML = "";
                const actions = document.createElement("div");
                actions.className = "ms-actions";
                const selectAllBtn = document.createElement("button");
                selectAllBtn.type = "button";
                selectAllBtn.className = "ms-action-btn";
                selectAllBtn.textContent = "Select all";
                selectAllBtn.addEventListener("click", () => {
                    totals.forEach((_total, name) => filterState.sgps.add(name));
                    applyFilters();
                });
                const clearBtn = document.createElement("button");
                clearBtn.type = "button";
                clearBtn.className = "ms-action-btn";
                clearBtn.textContent = "Clear";
                clearBtn.addEventListener("click", () => {
                    filterState.sgps.clear();
                    applyFilters();
                });
                actions.appendChild(selectAllBtn);
                actions.appendChild(clearBtn);
                sgpFilterMenuEl.appendChild(actions);
                Array.from(totals.keys())
                    .sort((a, b) => a.localeCompare(b))
                    .forEach((name) => {
                        const total = totals.get(name);
                        const count = counts.get(name) || 0;
                        const selected = filterState.sgps.has(name);
                        const option = document.createElement("button");
                        option.type = "button";
                        option.className = "ms-option";
                        option.setAttribute("role", "option");
                        option.setAttribute("aria-selected", selected ? "true" : "false");
                        option.disabled = count === 0 && !selected;
                        if (selected) option.classList.add("selected");
                        const check = document.createElement("span");
                        check.className = "ms-check";
                        check.textContent = selected ? "✓" : "";
                        option.appendChild(check);
                        const nameEl = document.createElement("span");
                        nameEl.className = "ms-name";
                        nameEl.textContent = name || "N/A";
                        option.appendChild(nameEl);
                        const countEl = document.createElement("span");
                        countEl.className = count === 0 ? "ms-count zero" : "ms-count";
                        countEl.textContent = count === total ? String(total) : count + "/" + total;
                        option.appendChild(countEl);
                        option.addEventListener("click", () => toggleSgp(name));
                        sgpFilterMenuEl.appendChild(option);
                    });
                sgpFilterMenuEl.scrollTop = scrollTop;
            }
            sgpFilterBtnEl.addEventListener("click", (event) => {
                event.stopPropagation();
                const open = sgpFilterMenuEl.hidden;
                if (open) refreshSgpFilterMenu();
                setSgpMenuOpen(open);
            });
            sgpFilterMenuEl.addEventListener("click", (event) => {
                event.stopPropagation();
            });
            document.addEventListener("click", (event) => {
                if (sgpFilterMenuEl.hidden) return;
                if (sgpFilterMenuEl.contains(event.target)) return;
                setSgpMenuOpen(false);
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !sgpFilterMenuEl.hidden) setSgpMenuOpen(false);
            });
            function getComponentColor(comp) {
                let hash = 0;
                for (let i = 0; i < comp.partname.length; i++) {
                    hash = comp.partname.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 250;
                const saturation = /active/i.test(comp.group) ? 70 : 40;
                const lightness = /active/i.test(comp.group) ? 55 : 45;
                const hslColor = new THREE.Color(`hsl(${hue}, ${saturation}%, ${lightness}%)`);
                return hslColor.getHex();
            }
            function selectComponent(comp, btnEl) {
                selectedComponent = comp;
                if (selectedButtonEl) selectedButtonEl.classList.remove("selected");
                btnEl.classList.add("selected");
                selectedButtonEl = btnEl;
                selectedBannerEl.classList.add("visible");
                selectedBannerEl.textContent =
                    "Selected: " +
                    comp.partname +
                    " — click the board to place it (" +
                    comp["pcb footprint (width)"] +
                    " × " +
                    comp["pcb footprint (length)"] +
                    " mm)";
                updateInspector();
                if (currentTool === "erase") {
                    setTool("select");
                }
            }
            function renderComponentList(items, candidates) {
                const pool = Array.isArray(candidates) ? candidates : items;
                componentListEl.innerHTML = "";
                selectedButtonEl = null;
                if (pool.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "component-empty-msg";
                    empty.textContent = "No components match the current filters.";
                    componentListEl.appendChild(empty);
                    refreshSgpFilterMenu();
                    return;
                }
                if (items.length === 0) {
                    const note = document.createElement("div");
                    note.className = "component-empty-msg";
                    note.textContent = "No components in the selected groups.";
                    componentListEl.appendChild(note);
                }
                const groups = new Map();
                pool.forEach((comp) => {
                    if (!groups.has(comp.group)) groups.set(comp.group, []);
                    groups.get(comp.group).push(comp);
                });
                Array.from(filterState.groups).forEach((name) => {
                    if (!groups.has(name)) groups.set(name, []);
                });
                Array.from(groups.keys()).forEach((groupName) => {
                    const total = groups.get(groupName).length;
                    const visible = items.filter((c) => c.group === groupName);
                    const label = document.createElement("div");
                    label.className = "component-group-label filterable";
                    label.title = "Click to filter by " + groupName;
                    if (filterState.groups.size > 0) {
                        if (filterState.groups.has(groupName)) label.classList.add("active");
                        else label.classList.add("empty");
                    }
                    const labelName = document.createElement("span");
                    labelName.textContent = groupName;
                    label.appendChild(labelName);
                    const labelCount = document.createElement("span");
                    labelCount.className = "gl-count";
                    labelCount.textContent = visible.length === total ? String(total) : visible.length + "/" + total;
                    label.appendChild(labelCount);
                    label.addEventListener("click", () => {
                        if (filterState.groups.has(groupName)) filterState.groups.delete(groupName);
                        else filterState.groups.add(groupName);
                        applyFilters();
                    });
                    componentListEl.appendChild(label);
                    if (visible.length === 0) return;
                    const grid = document.createElement("div");
                    grid.className = "component-grid";
                    visible.forEach((comp) => {
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "component-btn";
                        btn.dataset.tooltip =
                            comp["pcb footprint (width)"] +
                            " × " +
                            comp["pcb footprint (length)"] +
                            " × " +
                            comp["pcb footprint (height)"] +
                            " mm";
                        const nameEl = document.createElement("span");
                        nameEl.className = "btn-label";
                        nameEl.textContent = comp.partname;
                        btn.appendChild(nameEl);
                        const sizeEl = document.createElement("span");
                        sizeEl.className = "btn-tooltip";
                        sizeEl.textContent = btn.dataset.tooltip;
                        btn.appendChild(sizeEl);
                        if (selectedComponent && selectedComponent.partname === comp.partname) {
                            btn.classList.add("selected");
                            selectedButtonEl = btn;
                        }
                        btn.addEventListener("click", () => selectComponent(comp, btn));
                        grid.appendChild(btn);
                    });
                    componentListEl.appendChild(grid);
                });
                refreshSgpFilterMenu();
            }
            const scene = new THREE.Scene();
            const container = document.querySelector("#canvas-container");
            const width = container.clientWidth;
            const height = container.clientHeight;
            const btnTop = document.getElementById("btn-top");
            const btnBottom = document.getElementById("btn-bottom");
            const btnOrbit = document.getElementById("btn-orbit");
            const inputWidth = document.getElementById("input-width");
            const inputLength = document.getElementById("input-length");
            let boardWidth = parseFloat(inputWidth.value);
            let boardLength = parseFloat(inputLength.value);
            const MIN_BOARD_MM = 1;
            const MAX_BOARD_MM = 1000;
            function calculateCameraDistance(boardW, boardL) {
                const maxDim = Math.max(boardW, boardL);
                const fovInRadians = (camera.fov * Math.PI) / 180;
                return maxDim / (2 * Math.tan(fovInRadians / 2));
            }
            function fitsOnBoard(startX, startZ, compWidth, compLength) {
                if (pcbGrid.length === 0) return false;
                for (let x = startX; x < startX + compWidth; x++) {
                    if (x < 0 || x >= pcbGrid.length) return false;
                    for (let z = startZ; z < startZ + compLength; z++) {
                        if (z < 0 || z >= pcbGrid[x].length) return false;
                    }
                }
                return true;
            }
            function rebuildGridFromComponents() {
                initializeGridSystem(Math.floor(boardWidth), Math.floor(boardLength));
                spawnedComponents.forEach((m) => {
                    const info = m.userData;
                    const worldPos = gridToWorld(info.gridX, info.gridZ, info.width, info.length);
                    worldPos.y = getComponentYOffset(info.meshHeight);
                    m.position.copy(worldPos);
                    placeComponent(info.gridX, info.gridZ, info.width, info.length);
                });
            }
            function removeComponentMesh(mesh) {
                scene.remove(mesh);
                mesh.geometry.dispose();
                mesh.material.dispose();
                spawnedComponents = spawnedComponents.filter((m) => m !== mesh);
                if (inspectedMesh === mesh) inspectedMesh = null;
            }
            function dropComponentsThatNoLongerFit() {
                initializeGridSystem(Math.floor(boardWidth), Math.floor(boardLength));
                const doomed = [];
                spawnedComponents.forEach((m) => {
                    const info = m.userData;
                    if (!fitsOnBoard(info.gridX, info.gridZ, info.width, info.length)) {
                        doomed.push(m);
                    }
                });
                doomed.forEach((m) => removeComponentMesh(m));
                return doomed.length;
            }
            function readBoardSizeInputs() {
                let w = parseFloat(inputWidth.value);
                let l = parseFloat(inputLength.value);
                if (!Number.isFinite(w)) w = boardWidth;
                if (!Number.isFinite(l)) l = boardLength;
                w = Math.min(Math.max(w, MIN_BOARD_MM), MAX_BOARD_MM);
                l = Math.min(Math.max(l, MIN_BOARD_MM), MAX_BOARD_MM);
                inputWidth.value = w;
                inputLength.value = l;
                return { width: w, length: l };
            }
            function handleBoardSizeChange() {
                const next = readBoardSizeInputs();
                if (next.width === boardWidth && next.length === boardLength) return;
                saveState();
                updateBoardSize();
            }
            function updateBoardSize() {
                const size = readBoardSizeInputs();
                boardWidth = size.width;
                boardLength = size.length;
                pcbBase.geometry.dispose();
                const newBoardGeo = new THREE.BoxGeometry(boardWidth, boardLength, 0.1);
                pcbBase.geometry = newBoardGeo;
                gridGeometry.dispose();
                const newPoints = [];
                const halfW = boardWidth / 2;
                const halfL = boardLength / 2;
                for (let x = -halfW; x <= halfW; x += 1) {
                    newPoints.push(new THREE.Vector3(x, 0, -halfL), new THREE.Vector3(x, 0, halfL));
                }
                for (let z = -halfL; z <= halfL; z += 1) {
                    newPoints.push(new THREE.Vector3(-halfW, 0, z), new THREE.Vector3(halfW, 0, z));
                }
                gridGeometry.setFromPoints(newPoints);
                customTopGrid.position.y = pcbCenterY + thickness / 2 + 0.01;
                customBottomGrid.position.y = pcbCenterY - thickness / 2 - 0.01;

                const removed = dropComponentsThatNoLongerFit();
                rebuildGridFromComponents();
                if (removed > 0) {
                    updateInspector();
                    showStatusToast(
                        removed + " component" + (removed === 1 ? "" : "s") +
                            " no longer fit the board and " + (removed === 1 ? "was" : "were") +
                            " removed. Press Ctrl+Z to undo.",
                        "error"
                    );
                }

                updateCameraForCurrentView();
            }
            inputWidth.addEventListener("change", handleBoardSizeChange);
            inputLength.addEventListener("change", handleBoardSizeChange);
            const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
            const initialCameraZ = calculateCameraDistance(boardWidth, boardLength);
            camera.position.set(0, initialCameraZ * 1.2, 0);
            const renderer = new THREE.WebGLRenderer({
                canvas: document.querySelector("#three-canvas"),
                antialias: true,
                alpha: true,
            });
            renderer.setSize(container.clientWidth, container.clientHeight);
            window.addEventListener("resize", () => {
                const newwidth = container.clientWidth;
                const newheight = container.clientHeight;
                camera.aspect = newwidth / newheight;
                camera.updateProjectionMatrix();
                renderer.setSize(newwidth, newheight);
            });
            const axishelper = new THREE.AxesHelper(5);
            scene.add(axishelper);
            scene.background = null;
            const boardgeometry = new THREE.BoxGeometry(boardWidth, boardLength, 0.1);
            const ambientlight = new THREE.AmbientLight(0xffffff, 2.2);
            scene.add(ambientlight);
            const directionallight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionallight.position.set(5, 10, 7);
            scene.add(directionallight);
            const topCanvas = document.createElement("canvas");
            const bottomCanvas = document.createElement("canvas");
            topCanvas.width = 512;
            topCanvas.height = 896;
            bottomCanvas.width = 512;
            bottomCanvas.height = 896;
            const ctxTop = topCanvas.getContext("2d");
            const ctxBottom = bottomCanvas.getContext("2d");
            ctxTop.fillStyle = "#004d1a";
            ctxTop.fillRect(0, 0, 512, 896);
            ctxTop.font = "Bold 16px monospace";
            ctxTop.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctxTop.textAlign = "left";
            ctxTop.textBaseline = "top";
            ctxTop.fillText("TOP", 5, 5);
            ctxBottom.fillStyle = "#004d1a";
            ctxBottom.fillRect(0, 0, 512, 896);
            ctxBottom.font = "Bold 16px monospace";
            ctxBottom.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctxBottom.textAlign = "right";
            ctxBottom.textBaseline = "bottom";
            ctxBottom.fillText("BOTTOM", 507, 891);
            const topTexture = new THREE.CanvasTexture(topCanvas);
            const bottomTexture = new THREE.CanvasTexture(bottomCanvas);
            const sideMaterial = new THREE.MeshStandardMaterial({
                color: 0x004d1a,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });
            const topMaterial = new THREE.MeshStandardMaterial({
                map: topTexture,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });
            const bottomMaterial = new THREE.MeshStandardMaterial({
                map: bottomTexture,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
            });
            const pcbMaterials = [
                sideMaterial,
                sideMaterial,
                sideMaterial,
                sideMaterial,
                topMaterial,
                bottomMaterial,
            ];
            const pcbBase = new THREE.Mesh(boardgeometry, pcbMaterials);
            scene.add(pcbBase);
            pcbBase.rotation.x = -Math.PI / 2;
            pcbBase.position.y = -1;
            const defaultCameraRoll = -Math.PI / 6;
            camera.rotation.z = defaultCameraRoll;
            const controle = new THREE.OrbitControls(camera, renderer.domElement);
            controle.enableDamping = true;
            controle.dampingFactor = 0.4;
            let currentViewMode = "orbit";

                }
            }
            document.querySelector("#three-canvas").addEventListener("click", (event) => {
                if (suppressNextClick) {
                    suppressNextClick = false;
                    return;
                }
                const rect = renderer.domElement.getBoundingClientRect();
                const mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                const mouseY = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
                if (currentTool === "erase") {
                    const intersects = raycaster.intersectObjects(spawnedComponents);
                    if (intersects.length > 0) {
                        const clickedComponent = intersects[0].object;
                        saveState();
                        freeGridCells(clickedComponent.userData);
                        scene.remove(clickedComponent);
                        clickedComponent.geometry.dispose();
                        clickedComponent.material.dispose();
                        spawnedComponents = spawnedComponents.filter((mesh) => mesh !== clickedComponent);
                        updateInspector();
                    } else {
                        showPlacementError("Nothing to erase there.");
                    }
                } else {
                    if (!selectedComponent) {
                        showPlacementError("Pick a component from the list first.");
                        return;
                    }
                    const intersects = raycaster.intersectObject(pcbBase);
                    if (intersects.length > 0) {
                        const hitPoint = intersects[0].point;
                        const currentWidth = parseFloat(inputWidth.value);
                        const currentLength = parseFloat(inputLength.value);
                        const localX = hitPoint.x + currentWidth / 2;
                        const localZ = hitPoint.z + currentLength / 2;
                        const gridX = Math.floor(localX);
                        const gridZ = Math.floor(localZ);
                        const compWidth = selectedComponent["pcb footprint (width)"];
                        const compLength = selectedComponent["pcb footprint (length)"];
                        const compHeight = selectedComponent["pcb footprint (height)"];
                        const colorHex = getComponentColor(selectedComponent);
                        saveState();
                        const placed = spawnComponent(gridX, gridZ, compWidth, compLength, colorHex, compHeight);
                        if (!placed) {
                            undoStack.pop();
                            showPlacementError(
                                placementErrorMessage(
                                    getPlacementProblem(gridX, gridZ, compWidth, compLength)
                                )
                            );
                        } else {
                            lastPlaceTime = Date.now();
                        }
                    }
                }
            });
            const propsPanelEl = document.getElementById("component-props-panel");
            const propsTitleEl = document.getElementById("props-title");
            const propsSubtitleEl = document.getElementById("props-subtitle");
            const propsBodyEl = document.getElementById("props-body");
            const propsCloseEl = document.getElementById("props-close");
            let lastPlaceTime = 0;
            function escapeHTML(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
            function formatComponentJSON(value, indent) {
                const spaces = typeof indent === "number" ? indent : 4;
                try {
                    const text = JSON.stringify(value, null, spaces);
                    return text === undefined ? String(value) : text;
                } catch (err) {
                    return "/* Could not format this data: " + err.message + " */";
                }
            }
            function buildPropertyRow(key, value, isNested) {
                let shown;
                if (value === null) shown = "null";
                else if (value === undefined) shown = "—";
                else if (typeof value === "object") shown = JSON.stringify(value);
                else shown = String(value);
                return (
                    '<div class="props-row' + (isNested ? " props-row-nested" : "") + '">' +
                    '<span class="props-key">' + escapeHTML(key) + "</span>" +
                    '<span class="props-val">' + escapeHTML(shown) + "</span>" +
                    "</div>"
                );
            }
            function buildGroupRow(key) {
                return (
                    '<div class="props-row props-row-group">' +
                    '<span class="props-key">' + escapeHTML(key) + "</span>" +
                    "</div>"
                );
            }
            function buildPropertyRows(value, depth, keyName) {
                const isNested = depth > 0;
                if (value !== null && typeof value === "object") {
                    const keys = Object.keys(value);
                    const isArray = Array.isArray(value);
                    let html = isNested ? buildGroupRow(keyName) : "";
                    return (
                        html +
                        keys
                            .map((key) => {
                                const childName = isArray ? keyName + "[" + key + "]" : key;
                                return buildPropertyRows(value[key], depth + 1, childName);
                            })
                            .join("")
                    );
                }
                return buildPropertyRow(keyName, value, isNested);
            }
            function showComponentProperties(mesh) {
                if (!mesh) return;
                const libraryEntry = findComponentDetails(mesh.userData.partname);
                const record = (libraryEntry && libraryEntry.raw) || libraryEntry || mesh.userData;
                const displayName =
                    (libraryEntry && libraryEntry.partname) ||
                    firstDefined(record, ["part_name", "Part_name"]) ||
                    mesh.userData.partname ||
                    "Component";
                const reference =
                    (libraryEntry && libraryEntry.partNumber) ||
                    firstDefined(record, ["part_number", "Part_number"]) ||
                    "";
                propsTitleEl.textContent = displayName;
                propsSubtitleEl.textContent = reference ? "Ref: " + reference : "";
                let html = '<div class="props-section-title">Properties</div>';
                html += buildPropertyRows(record, 0, "value");
                html += '<div class="props-section-title">Placement</div>';
                html += buildPropertyRow("Grid X", mesh.userData.gridX + " mm", false);
                html += buildPropertyRow("Grid Z", mesh.userData.gridZ + " mm", false);
                html += buildPropertyRow("Width", mesh.userData.width + " mm", false);
                html += buildPropertyRow("Length", mesh.userData.length + " mm", false);
                html += buildPropertyRow("Height", mesh.userData.meshHeight + " mm", false);
                html += '<div class="props-section-title">Raw JSON</div>';
                html += '<pre class="props-json">' + escapeHTML(formatComponentJSON(record)) + "</pre>";
                propsBodyEl.innerHTML = html;
                propsBodyEl.scrollTop = 0;
                propsPanelEl.classList.add("visible");
            }
            function closeComponentProperties() {
                propsPanelEl.classList.remove("visible");
            }
            function handleComponentDoubleClick(event) {
                if (Date.now() - lastPlaceTime < 400) {
                    closeComponentProperties();
                    return;
                }
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(getPointerNDC(event), camera);
                const hits = raycaster.intersectObjects(spawnedComponents, false);
                if (hits.length === 0) {
                    closeComponentProperties();
                    return;
                }
                showComponentProperties(hits[0].object);
            }
            renderer.domElement.addEventListener("dblclick", handleComponentDoubleClick);
            propsCloseEl.addEventListener("click", closeComponentProperties);
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape") closeComponentProperties();
            });
            function animate() {
                requestAnimationFrame(animate);
                controle.update();
                renderer.render(scene, camera);
            }
            animate();
            updateInspector();
            switchTab("info");
</script>
    </body>
</html>
