                        groups.set(key, {
                            partname: info.partname,
                            group: info.group || "N/A",
                            subgroup:
                                info.sgpName ||
                                (details && details.sgpName) ||
                                "N/A",
                            quantity: 0,
                            details: details,
                            unitWeightG: readComponentMassGrams(details),
                        });
                    }
                    groups.get(key).quantity += 1;
                });
                return Array.from(groups.values());
            }
            function inspectPlacedComponent(mesh) {
                inspectedMesh = mesh || null;
                updateComponentHighlights();
                updateInspector();
            }
            function infoRow(key, value) {
                return (
                    '<div class="info-row"><span class="info-key">' +
                    escapeHTML(key) +
                    '</span><span class="info-val">' +
                    escapeHTML(value) +
                    "</span></div>"
                );
            }

            function renderInfoPane(comp, mesh) {
                if (mesh) {
                    const info = mesh.userData;
                    paneInfo.innerHTML = [
                        infoRow("Reference", info.reference || "—"),
                        infoRow("Part", info.partname),
                        infoRow("Group", info.group || "—"),
                        infoRow(
                            "Mounting",
                            formatMountingTypeLabel(
                                getComponentMountingType(info),
                            ),
                        ),
                        infoRow(
                            "Side",
                            normalizeSide(info.side) === "bottom"
                                ? "Bottom"
                                : "Top",
                        ),
                        infoRow("Cell", info.gridX + ", " + info.gridZ),
                        infoRow(
                            "Size",
                            info.width +
                                " × " +
                                info.length +
                                " × " +
                                info.meshHeight +
                                " mm",
                        ),
                        infoRow("obj_id", info.objId || "—"),
                    ].join("");
                    return;
                }
                if (!comp) {
                    paneInfo.innerHTML =
                        '<div class="bom-empty">Select a component from the list</div>';
                    return;
                }
                const rows = [
                    ["Part", comp.partname],
                    ["Group", comp.group],
                    [
                        "Mounting",
                        formatMountingTypeLabel(getComponentMountingType(comp)),
                    ],
                    [
                        "Width",
                        comp["pcb footprint (width)"] !== undefined
                            ? comp["pcb footprint (width)"] + " mm"
                            : "—",
                    ],
                    [
                        "Length",
                        comp["pcb footprint (length)"] !== undefined
                            ? comp["pcb footprint (length)"] + " mm"
                            : "—",
                    ],
                    [
                        "Height",
                        comp["pcb footprint (height)"] !== undefined
                            ? comp["pcb footprint (height)"] + " mm"
                            : "—",
                    ],
                ];
                paneInfo.innerHTML = rows
                    .map(([k, v]) => infoRow(k, v))
                    .join("");
            }
            function renderBomPane() {
                const bom = generateBillOfMaterials();
                if (bom.length === 0) {
                    paneBom.innerHTML =
                        '<div class="bom-empty">No components placed on the PCB</div>';
                    return;
                }

                let totalWeightG = 0;
                let hasAnyWeight = false;
                bom.forEach((entry) => {
                    if (entry.unitWeightG !== null) {
                        totalWeightG += entry.unitWeightG * entry.quantity;
                        hasAnyWeight = true;
                    }
                });
                const totalWeightDisplay = hasAnyWeight
                    ? totalWeightG >= 1000
                        ? (totalWeightG / 1000).toFixed(3) + " kg"
                        : totalWeightG.toFixed(3) + " g"
                    : "N/A";

                let html = `
                    <div class="bom-badges">
                        <div class="bom-badge">
                            <span class="bom-badge-label">Total</span>
                            <span class="bom-badge-value">${spawnedComponents.length}</span>
                        </div>
                        <div class="bom-badge">
                            <span class="bom-badge-label">Unique</span>
                            <span class="bom-badge-value">${bom.length}</span>
                        </div>
                        <div class="bom-badge bom-badge-weight">
                            <span class="bom-badge-label">⚖ Weight</span>
                            <span class="bom-badge-value">${totalWeightDisplay}</span>
                        </div>
                    </div>
                    <div class="bom-table-wrap">
                    <table class="bom-table">
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th class="col-group">Subgroup</th>
                                <th class="col-qty">Qty</th>
                                <th class="col-weight">Unit Wt (g)</th>
                                <th class="col-weight">Total Wt</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                bom.forEach((entry) => {
                    const isActive =
                        inspectedMesh &&
                        inspectedMesh.userData.partname === entry.partname;
                    const unitWt =
                        entry.unitWeightG !== null
                            ? entry.unitWeightG.toFixed(3)
                            : "—";
                    const rowTotalWtG =
                        entry.unitWeightG !== null
                            ? entry.unitWeightG * entry.quantity
                            : null;
                    const rowTotalWt =
                        rowTotalWtG !== null
                            ? rowTotalWtG >= 1000
                                ? (rowTotalWtG / 1000).toFixed(3) + " kg"
                                : rowTotalWtG.toFixed(3) + " g"
                            : "—";
                    html += `
                        <tr class="bom-row${isActive ? " bom-row-active" : ""}"
                            data-partname="${entry.partname}">
                            <td>${entry.partname}</td>
                            <td class="col-group" title="${entry.subgroup}">${entry.subgroup}</td>
                            <td class="col-qty">${entry.quantity}</td>
                            <td class="col-weight">${unitWt}</td>
                            <td class="col-weight">${rowTotalWt}</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                        <tfoot>
                            <tr class="bom-total-row">
                                <td colspan="3"><strong>⚖ Total Circuit Weight</strong></td>
                                <td class="col-weight">—</td>
                                <td class="col-weight"><strong>${totalWeightDisplay}</strong></td>
                            </tr>
                        </tfoot>
                    </table></div>`;
                paneBom.innerHTML = html;
                paneBom.querySelectorAll(".bom-row").forEach((row) => {
                    row.addEventListener("click", () => {
                        const mesh = spawnedComponents.find(
                            (m) => m.userData.partname === row.dataset.partname,
                        );
                        if (mesh) {
                            inspectPlacedComponent(mesh);
                            switchTab("info");
                        }
                    });
                });
            }
            function updateInspector() {
                if (
                    inspectedMesh &&
                    spawnedComponents.indexOf(inspectedMesh) === -1
                ) {
                    inspectedMesh = null;
                }

                const mesh =
                    getSelectedComponents()[0] || inspectedMesh || null;
                const infoComp = mesh
                    ? findComponentDetails(mesh.userData.partname)
                    : selectedComponent;
                renderInfoPane(infoComp, mesh);
                renderBomPane();
                if (
                    spawnedComponents.length > 0 &&
                    activeTab === "info" &&
                    !selectedComponent &&
                    !mesh
                ) {
                    switchTab("bom");
                }
            }

            const propsPanelEl = document.getElementById(
                "component-props-panel",
            );
            const propsTitleEl = document.getElementById("props-title");
            const propsSubtitleEl = document.getElementById("props-subtitle");
            const propsBodyEl = document.getElementById("props-body");
            const propsCloseEl = document.getElementById("props-close");
            function escapeHTML(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
            function formatComponentJSON(value, indent) {
                const spaces = typeof indent === "number" ? indent : 4;
                try {
                    const text = JSON.stringify(value, null, spaces);
                    return text === undefined ? String(value) : text;
                } catch (err) {
                    return (
                        "/* Could not format this data: " + err.message + " */"
                    );
                }
            }
            function buildPropertyRow(key, value, isNested) {
                let shown;
                if (value === null) shown = "null";
                else if (value === undefined) shown = "—";
                else if (typeof value === "object")
                    shown = JSON.stringify(value);
                else shown = String(value);
                return (
                    '<div class="props-row' +
                    (isNested ? " props-row-nested" : "") +
                    '">' +
                    '<span class="props-key">' +
                    escapeHTML(key) +
                    "</span>" +
                    '<span class="props-val">' +
                    escapeHTML(shown) +
                    "</span>" +
                    "</div>"
                );
            }
            function buildGroupRow(key) {
                return (
                    '<div class="props-row props-row-group">' +
                    '<span class="props-key">' +
                    escapeHTML(key) +
                    "</span>" +
                    "</div>"
                );
            }
            function buildPropertyRows(value, depth, keyName) {
                const isNested = depth > 0;
                if (value !== null && typeof value === "object") {
                    const keys = Object.keys(value);
                    const isArray = Array.isArray(value);
                    let html = isNested ? buildGroupRow(keyName) : "";
                    return (
                        html +
                        keys
                            .map((key) => {
                                const childName = isArray
                                    ? keyName + "[" + key + "]"
                                    : key;
                                return buildPropertyRows(
                                    value[key],
                                    depth + 1,
                                    childName,
                                );
                            })
                            .join("")
                    );
                }
                return buildPropertyRow(keyName, value, isNested);
            }
            const HIDDEN_COMPONENT_DETAIL_KEYS = new Set([
                "json_attr",
                "json_attr3",
                "json_stress_f",
            ]);
            const INTERNAL_COMPONENT_PROPERTY_KEYS = new Set([
                "label",
                "labeltexture",
                "raw",
            ]);

            function isHiddenComponentDetailKey(key) {
                return HIDDEN_COMPONENT_DETAIL_KEYS.has(
                    String(key).toLowerCase(),
                );
            }
            function isInternalComponentPropertyKey(key) {
                return INTERNAL_COMPONENT_PROPERTY_KEYS.has(
                    String(key).toLowerCase(),
                );
            }
            function formatPropertyDisplayValue(value) {
                if (value === null || value === undefined) return "—";
                if (typeof value === "string") {
                    const trimmed = value.trim();
                    return trimmed === "" ? "—" : trimmed;
                }
                if (typeof value === "object") {
                    try {
                        return JSON.stringify(value);
                    } catch (err) {
                        return String(value);
                    }
                }
                return String(value);
            }
            function buildComponentPropertiesSection(record) {
                const source =
                    record && typeof record === "object" ? record : {};
                const rows = Object.keys(source)
                    .filter(
                        (key) =>
                            !isHiddenComponentDetailKey(key) &&
                            !isInternalComponentPropertyKey(key),
                    )
                    .map((key) =>
                        buildPropertyRow(
                            key,
                            formatPropertyDisplayValue(source[key]),
                            false,
                        ),
                    )
                    .join("");
                return (
                    '<div class="props-section-title">Component Properties</div>' +
                    (rows ||
                        '<div class="props-empty">No component properties available.</div>')
                );
            }
            function buildAttributesSection(record) {
                const title =
                    '<div class="props-section-title">Attributes</div>';
                const attributes = firstDefined(record, [
                    "json_attr",
                    "Json_attr",
                ]);
                if (
                    !attributes ||
                    typeof attributes !== "object" ||
                    Array.isArray(attributes) ||
                    Object.keys(attributes).length === 0
                ) {
                    return (
                        title +
                        '<div class="props-empty">No attributes available.</div>'
                    );
                }
                return (
                    title +
                    Object.keys(attributes)
                        .map((key) =>
                            buildPropertyRow(
                                key,
                                formatPropertyDisplayValue(attributes[key]),
                                false,
                            ),
                        )
                        .join("")
                );
            }
            function formatCategorizedAttributeValue(entry) {
                const value = formatPropertyDisplayValue(entry && entry.pv);
                const unit = formatPropertyDisplayValue(entry && entry.pu);
                if (value === "—" && unit === "—") return "—";
                if (value === "—") return unit;
                return unit === "—" ? value : value + " " + unit;
            }
            function buildCategorizedAttributesSection(record) {
                const title =
                    '<div class="props-section-title">Categorized Attribute Details</div>';
                const entries = firstDefined(record, [
                    "json_attr3",
                    "Json_attr3",
                ]);
                if (!Array.isArray(entries) || entries.length === 0) {
                    return (
                        title +
                        '<div class="props-empty">No categorized attributes available.</div>'
                    );
                }
                const categories = new Map();
                entries.forEach((entry) => {
                    if (!entry || typeof entry !== "object") return;
                    const category = formatPropertyDisplayValue(entry.pc);
                    const heading = category === "—" ? "Other" : category;
                    if (!categories.has(heading)) categories.set(heading, []);
                    categories.get(heading).push(entry);
                });
                if (categories.size === 0) {
                    return (
                        title +
                        '<div class="props-empty">No categorized attributes available.</div>'
                    );
                }
                let html = title;
                categories.forEach((rows, category) => {
                    html +=
                        '<div class="props-attr-category">' +
                        escapeHTML(category) +
                        "</div>";
                    html +=
                        '<table class="props-table"><thead><tr><th>Property</th><th>Value</th></tr></thead><tbody>';
                    rows.forEach((entry) => {
                        html +=
                            "<tr><td>" +
                            escapeHTML(formatPropertyDisplayValue(entry.pn)) +
                            "</td><td>" +
                            escapeHTML(formatCategorizedAttributeValue(entry)) +
                            "</td></tr>";
                    });
                    html += "</tbody></table>";
                });
                return html;
            }
            function buildPlacementSection(info) {
                let html = '<div class="props-section-title">Placement</div>';
                html += buildPropertyRow(
                    "Reference",
                    info.reference || "—",
                    false,
                );
                html += buildPropertyRow(
                    "Side",
                    normalizeSide(info.side) === "bottom" ? "Bottom" : "Top",
                    false,
                );
                html += buildPropertyRow("Grid X", info.gridX + " mm", false);
                html += buildPropertyRow("Grid Z", info.gridZ + " mm", false);
                html += buildPropertyRow("Width", info.width + " mm", false);
                html += buildPropertyRow("Length", info.length + " mm", false);
                html += buildPropertyRow(
                    "Height",
                    info.meshHeight + " mm",
                    false,
                );
                html += buildPropertyRow(
                    "Rotation",
                    (info.rotation || 0) + "°",
                    false,
                );
                html += buildPropertyRow("obj_id", info.objId || "—", false);
                return html;
            }
            function showPropertiesPanel(record, options) {
                const opts = options || {};
                const source =
                    record && typeof record === "object" ? record : {};
                const displayName =
                    opts.displayName ||
                    firstDefined(source, [
                        "part_name",
                        "Part_name",
                        "partname",
                        "name",
                    ]) ||
                    "Component";
                const partReference =
                    opts.partReference ||
                    firstDefined(source, [
                        "part_number",
                        "Part_number",
                        "partNumber",
                    ]) ||
                    "";
                propsTitleEl.textContent = displayName;
                propsSubtitleEl.textContent = [
                    opts.reference ? "Ref: " + opts.reference : "",
                    partReference ? "PN: " + partReference : "",
                ]
                    .filter(Boolean)
                    .join("  ·  ");
                let html = buildComponentPropertiesSection(source);
                html += buildAttributesSection(source);
                html += buildCategorizedAttributesSection(source);
                if (opts.placement)
                    html += buildPlacementSection(opts.placement);
                propsBodyEl.innerHTML = html;
                propsBodyEl.scrollTop = 0;
                propsPanelEl.classList.add("visible");
            }
            function showComponentProperties(mesh) {
                if (!mesh) return;
                const info = mesh.userData;
                const libraryEntry = resolveLibraryEntryFor({
                    obj_id: info.objId,
                    partname: info.partname,
                });
                const record = libraryEntry
                    ? libraryEntry.raw || libraryEntry
                    : info;
                showPropertiesPanel(record, {
                    displayName:
                        (libraryEntry && libraryEntry.partname) ||
                        info.partname ||
                        "Component",
                    partReference:
                        (libraryEntry && libraryEntry.partNumber) ||
                        firstDefined(record, ["part_number", "Part_number"]) ||
                        "",
                    reference: info.reference,
                    placement: info,
                });
            }
            function showLibraryComponentProperties(comp) {
                if (!comp) return;
                const libraryEntry =
                    resolveLibraryEntryFor({
                        obj_id: comp.objId,
                        partname: comp.partname,
                    }) || comp;
                const record = libraryEntry.raw || libraryEntry;
                showPropertiesPanel(record, {
                    displayName:
                        libraryEntry.partname || comp.partname || "Component",
                    partReference:
                        libraryEntry.partNumber ||
                        firstDefined(record, ["part_number", "Part_number"]) ||
                        "",
                    placement: null,
                });
            }
            function closeComponentProperties() {
                propsPanelEl.classList.remove("visible");
            }

            propsCloseEl.addEventListener("click", closeComponentProperties);
            window.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    closeComponentProperties();
                    clearComponentSelection();
                }
            });
            function animate() {
                requestAnimationFrame(animate);
                controle.update();
                renderer.render(scene, camera);
            }
            animate();
            updateInspector();
            switchTab("info");

            saveState();
            refreshUndoRedoButtons();
        </script>
    </body>
</html>
