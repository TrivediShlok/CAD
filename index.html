<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PCB Dim/Weight Estimation</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background: #1a1a2e;
                color: #eaeaea;
                height: 100vh;
                overflow: hidden;
                display: grid;
                grid-template-columns: 340px minmax(0, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
            }

            .top-toolbar {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 10px 20px;
                background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
                border-bottom: 1px solid #0f3460;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
                flex-wrap: wrap;
                row-gap: 10px;
                z-index: 100;
            }

            .toolbar-section {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 0 16px;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }

            .toolbar-section:last-child {
                border-right: none;
                padding-right: 0;
            }

            .toolbar-section:first-child {
                padding-left: 0;
            }

            @media (max-width: 900px) {
                .toolbar-section {
                    border-right: none;
                    padding: 0;
                }
            }

            .toolbar-section-title {
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #8899bb;
                font-weight: 600;
                margin-right: 8px;
            }

            .toolbar-input-group {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .toolbar-input-group label {
                font-size: 12px;
                color: #ccc;
                white-space: nowrap;
            }

            .toolbar-input-group input {
                width: 70px;
                padding: 6px 10px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #fff;
                font-size: 13px;
                outline: none;
            }

            .toolbar-input-group input:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }

            .toolbar-btn {
                padding: 8px 14px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #eaeaea;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .toolbar-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .toolbar-btn.active {
                background: #4dabf7;
                border-color: #4dabf7;
                color: #1a1a2e;
                font-weight: 600;
            }

            .toolbar-btn.active:hover {
                background: #74c0fc;
            }

            .toolbar-toggle {
                display: flex;
                border-radius: 4px;
                overflow: hidden;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }

            .toolbar-toggle .toolbar-btn {
                border-radius: 0;
                border: none;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
            }

            .toolbar-toggle .toolbar-btn:last-child {
                border-right: none;
            }

            .btn-undo-redo {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 4px;
                color: #eaeaea;
                font-size: 13px;
                cursor: pointer;
                transition:
                    background 0.2s,
                    border-color 0.2s;
            }

            .btn-undo-redo:hover {
                background: rgba(255, 255, 255, 0.18);
                border-color: rgba(255, 255, 255, 0.3);
            }

            .btn-undo-redo:disabled {
                opacity: 0.35;
                cursor: not-allowed;
            }

            .toolbar-btn.side-top.active {
                background: #22c55e;
                border-color: #22c55e;
                color: #111;
            }

            .toolbar-btn.side-bottom.active {
                background: #f59e0b;
                border-color: #f59e0b;
                color: #111;
            }

            .toolbar-btn.side-auto.active {
                background: #4dabf7;
                border-color: #4dabf7;
                color: #1a1a2e;
            }

            .sidebar {
                grid-column: 1;
                grid-row: 2;
                min-height: 0;
                min-width: 0;
                display: grid;

                grid-template-rows: minmax(0, 1fr) minmax(140px, 40%);
                background: #16213e;
                border-right: 1px solid #0f3460;
                overflow: hidden;
            }

            .components-panel {
                min-height: 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .sidebar-header {
                padding: 14px 16px;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.2);
            }

            .sidebar-header h2 {
                font-size: 14px;
                font-weight: 600;
                color: #fff;
                letter-spacing: 0.3px;
            }

            .component-search {
                width: calc(100% - 32px);
                padding: 10px 12px;
                margin: 12px 16px 0;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: #131313;
                font-weight: 600;
                font-size: 13px;
                outline: none;
            }

            .component-search:focus {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }

            .component-search::placeholder {
                color: #667799;
            }

            .filter-row {
                position: relative;
                width: calc(100% - 32px);
                margin: 8px 16px 0;
            }

            .ms-select {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 9px 12px;
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 6px;
                color: #eaeaea;
                font-weight: 600;
                font-size: 13px;
                text-align: left;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
            }

            .ms-select:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.2);
            }

            .ms-select.open {
                border-color: #4dabf7;
                box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2);
            }

            .ms-select.active {
                border-color: rgba(77, 171, 247, 0.55);
                color: #a5d6f7;
            }

            .ms-select .ms-caret {
                flex: none;
                color: #7f93b8;
                font-size: 10px;
            }

            .ms-select .ms-count-badge {
                flex: none;
                padding: 1px 7px;
                border-radius: 999px;
                background: rgba(77, 171, 247, 0.22);
                border: 1px solid rgba(77, 171, 247, 0.4);
                color: #a5d6f7;
                font-size: 10px;
                font-weight: 700;
            }

            .ms-menu {
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                right: 0;
                z-index: 30;
                max-height: 220px;
                overflow-y: auto;
                padding: 4px;
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 6px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            }

            .ms-menu[hidden] {
                display: none;
            }

            .ms-actions {
                display: flex;
                gap: 6px;
                padding: 4px 4px 6px;
                margin-bottom: 4px;
                border-bottom: 1px solid rgba(127, 147, 184, 0.2);
            }

            .ms-action-btn {
                flex: 1;
                padding: 5px 6px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                color: #cfd8ea;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }

            .ms-action-btn:hover {
                background: rgba(255, 255, 255, 0.12);
                color: #fff;
            }

            .ms-option {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 8px;
                background: none;
                border: none;
                border-radius: 4px;
                color: #eaeaea;
                font-size: 12px;
                text-align: left;
                cursor: pointer;
                transition: background 0.12s ease;
            }

            .ms-option:hover {
                background: rgba(255, 255, 255, 0.08);
            }

            .ms-option.selected {
                background: rgba(77, 171, 247, 0.12);
            }

            .ms-option:disabled {
                opacity: 0.4;
                cursor: default;
            }

            .ms-option .ms-check {
                flex: none;
                width: 12px;
                color: #4dabf7;
                font-weight: 700;
            }

            .ms-option .ms-name {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .ms-option .ms-count {
                flex: none;
                color: #7f93b8;
                font-size: 10px;
                font-variant-numeric: tabular-nums;
            }

            .ms-option .ms-count.zero {
                color: #5a6b8c;
            }

            .selected-banner,
            #selected-component-banner {
                width: calc(100% - 32px);
                margin: 10px 16px 0;
                padding: 10px 12px;
                background: rgba(76, 175, 80, 0.15);
                border: 1px solid rgba(76, 175, 80, 0.35);
                border-radius: 6px;
                font-size: 12px;
                line-height: 1.4;
                color: #a5d6a7;
                display: none;
            }

            .selected-banner.visible {
                display: block;
            }

            .group-banner {
                background: rgba(77, 171, 247, 0.15);
                border-color: rgba(77, 171, 247, 0.4);
                color: #a5d6f7;
            }

            .group-banner .group-hint {
                display: block;
                margin-top: 4px;
                color: #cfd8ea;
                font-size: 11px;
            }

            .component-list-wrapper {
                flex: 1;
                overflow-y: auto;
                padding: 8px 16px 16px;
            }

            .component-group-label {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: #7f93b8;
                background: none;
                padding: 10px 10px 6px;
                margin: 12px 0 0;
                border-radius: 0;
                border-bottom: 1px solid rgba(127, 147, 184, 0.2);
            }

            .component-group-label:first-child {
                margin-top: 0;
            }

            .component-group-label.filterable {
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
                transition:
                    color 0.15s ease,
                    background 0.15s ease,
                    border-color 0.15s ease;
            }

            .component-group-label.filterable:hover {
                color: #cfe0ff;
                background: rgba(255, 255, 255, 0.05);
            }

            .component-group-label.active {
                color: #4dabf7;
                border-bottom-color: rgba(77, 171, 247, 0.6);
            }

            .component-group-label.empty {
                opacity: 0.4;
            }

            .component-group-label .gl-count {
                float: right;
                font-size: 9px;
                letter-spacing: 0;
                text-transform: none;
                color: #7f93b8;
                font-variant-numeric: tabular-nums;
            }

            .component-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .component-btn {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 3px;
                padding: 9px 10px;
                min-height: 46px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #eaeaea;
                font-size: 12px;
                line-height: 1.35;
                text-align: left;
                cursor: pointer;
                transition: all 0.15s ease;
            }

            .component-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                border-color: rgba(255, 255, 255, 0.2);
                transform: translateY(-1px);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
            }

            .component-btn.selected {
                background: rgba(76, 175, 80, 0.2);
                border-color: #4caf50;
                box-shadow: 0 0 0 1px #4caf50;
            }

            .component-btn::before,
            .component-btn::after {
                content: none;
            }

            .component-btn .btn-label {
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                width: 100%;
            }

            .component-btn .btn-tooltip {
                font-size: 10px;
                color: #7f93b8;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
                margin-top: 0;
            }

            .component-btn.selected .btn-tooltip {
                color: #a5d6a7;
            }

            .component-empty-msg {
                color: #8899bb;
                font-size: 12px;
                font-style: italic;
                text-align: center;
                padding: 24px 8px;
                line-height: 1.5;
            }

            .canvas-area {
                grid-column: 2;
                grid-row: 2;
                min-width: 0;
                min-height: 0;
                position: relative;
                overflow: hidden;
                background: radial-gradient(
                    ellipse at center,
                    #1a1a3e 0%,
                    #0d0d1a 100%
                );
            }

            #three-canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            .props-panel {
                position: absolute;
                top: 16px;
                right: 16px;
                bottom: 16px;
                width: 340px;
                max-width: calc(100% - 32px);
                display: none;
                flex-direction: column;
                background: #16213e;
                border: 1px solid #0f3460;
                border-radius: 8px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
                overflow: hidden;
                z-index: 10;
            }

            .props-panel.visible {
                display: flex;
            }

            .props-header {
                display: flex;
                align-items: flex-start;
                gap: 10px;
                padding: 12px 14px;
                background: rgba(0, 0, 0, 0.25);
                border-bottom: 1px solid #0f3460;
                flex-shrink: 0;
            }

            .props-title-group {
                flex: 1;
                min-width: 0;
            }

            .props-title {
                font-size: 13px;
                font-weight: 700;
                color: #fff;
                line-height: 1.3;
                word-break: break-word;
            }

            .props-subtitle {
                font-size: 10px;
                color: #8899bb;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                margin-top: 3px;
                word-break: break-word;
            }

            .props-subtitle:empty {
                display: none;
            }

            .props-close {
                flex-shrink: 0;
                width: 26px;
                height: 26px;
                padding: 0;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 5px;
                color: #eaeaea;
                font-size: 17px;
                line-height: 1;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease;
            }

            .props-close:hover {
                background: rgba(255, 90, 90, 0.25);
                border-color: rgba(255, 90, 90, 0.5);
                color: #fff;
            }

            .props-body {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                padding: 12px 14px 16px;
            }

            .props-section-title {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.6px;
                color: #4dabf7;
                margin: 16px 0 7px;
                padding-bottom: 4px;
                border-bottom: 1px solid rgba(77, 171, 247, 0.2);
            }

            .props-section-title:first-child {
                margin-top: 0;
            }

            .props-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10px;
                padding: 4px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 11px;
            }

            .props-row-nested {
                padding-left: 14px;
            }

            .props-row-group {
                justify-content: flex-start;
                padding-bottom: 2px;
                border-bottom: none;
            }

            .props-row-group .props-key {
                max-width: 100%;
                color: #cce;
                font-weight: 700;
                margin-top: 4px;
            }

            .props-key {
                color: #8899bb;
                flex-shrink: 1;
                max-width: 52%;
                word-break: break-word;
            }

            .props-val {
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }

            .props-json {
                margin: 0;
                padding: 10px;
                background: rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 6px;
                color: #9fe0b0;
                font-family: Consolas, Menlo, "Courier New", monospace;
                font-size: 11px;
                line-height: 1.5;

                white-space: pre;
                overflow-x: auto;
            }

            .props-empty {
                padding: 6px 0;
                color: #8899bb;
                font-size: 11px;
                font-style: italic;
            }

            .props-attr-category {
                margin: 12px 0 5px;
                color: #cce;
                font-size: 11px;
                font-weight: 700;
                word-break: break-word;
            }

            .props-table {
                width: 100%;
                border-collapse: collapse;
                table-layout: fixed;
                font-size: 11px;
            }

            .props-table th {
                padding: 5px 6px;
                border-bottom: 1px solid rgba(77, 171, 247, 0.25);
                color: #4dabf7;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.5px;
                text-align: left;
                text-transform: uppercase;
            }

            .props-table td {
                padding: 5px 6px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                vertical-align: top;
                word-break: break-word;
            }

            .props-table th:first-child,
            .props-table td:first-child {
                width: 45%;
                color: #8899bb;
            }

            .props-table td:last-child {
                color: #eaeaea;
                font-weight: 500;
            }

            .status-toast {
                position: fixed;
                max-width: min(520px, calc(100vw - 32px));
                padding: 11px 18px;
                background: #16213e;
                border: 1px solid #4dabf7;
                border-radius: 8px;
                box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
                color: #eaeaea;
                font-size: 12.5px;
                line-height: 1.45;
                text-align: center;
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease;
                z-index: 50;
            }

            #status-toast {
                left: 50%;
                bottom: 24px;
                transform: translate(-50%, 20px);
            }

            #status-toast.visible {
                transform: translate(-50%, 0);
            }

            #placement-toast {
                right: 16px;
                bottom: 16px;
                transform: translateY(20px);
                text-align: left;
                max-width: min(420px, calc(100vw - 32px));
                font-weight: 500;
            }

            #placement-toast.visible {
                transform: translateY(0);
            }

            .status-toast.visible {
                opacity: 1;
            }

            .status-toast.toast-error {
                border-color: #ff6b6b;
                color: #ffc9c9;
            }

            .status-toast.toast-success {
                border-color: #4caf50;
                color: #c8e6c9;
            }

            .inspector-panel {
                height: 100%;
                min-height: 0;
                background: #16213e;
                border-top: 2px solid #0f3460;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .inspector-header {
                padding: 0;
                border-bottom: 1px solid #0f3460;
                background: rgba(0, 0, 0, 0.25);
                flex-shrink: 0;
            }

            .inspector-tabs {
                display: flex;
                align-items: stretch;
            }

            .inspector-tab {
                flex: 1;
                padding: 10px 8px;
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                cursor: pointer;
                transition:
                    color 0.15s,
                    border-color 0.15s,
                    background 0.15s;
                text-align: center;
            }

            .inspector-tab:hover {
                color: #cce;
                background: rgba(255, 255, 255, 0.04);
            }

            .inspector-tab.active {
                color: #4dabf7;
                border-bottom-color: #4dabf7;
                background: rgba(77, 171, 247, 0.06);
            }

            .inspector-pane {
                display: none;
            }

            .inspector-pane.active {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                padding: 10px 14px 12px;
                font-size: 12px;
                color: #bbb;
            }

            .info-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                padding: 5px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                gap: 8px;
            }

            .info-row:last-child {
                border-bottom: none;
            }

            .info-key {
                font-size: 10px;
                text-transform: uppercase;
                letter-spacing: 0.4px;
                color: #8899bb;
                flex-shrink: 0;
            }

            .info-val {
                font-size: 12px;
                color: #eaeaea;
                font-weight: 500;
                text-align: right;
                word-break: break-word;
            }

            .bom-badges {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }

            .bom-badge {
                flex: 1;
                background: rgba(77, 171, 247, 0.1);

        <script src="three.min.js"></script>

        <script>
            let componentData = [];
            let selectedComponent = null;
            let selectedButtonEl = null;
            const componentListEl = document.getElementById("component-list");
            const componentSearchEl =
                document.getElementById("component-search");
            const selectedBannerEl = document.getElementById(
                "selected-component-banner",
            );
            const sgpFilterBtnEl = document.getElementById("sgp-filter-btn");
            const sgpFilterLabelEl =
                document.getElementById("sgp-filter-label");
            const sgpFilterMenuEl = document.getElementById("sgp-filter-menu");
            function extractComponentRecords(data) {
                if (Array.isArray(data)) return data;
                if (data && Array.isArray(data.items)) return data.items.flat();
                if (data && Array.isArray(data.components))
                    return data.components.flat();
                return [];
            }
            function firstDefined(record, names) {
                if (!record) return undefined;
                for (const name of names) {
                    if (record[name] !== undefined && record[name] !== null)
                        return record[name];
                }
                return undefined;
            }
            function readFootprint(attr, key) {
                const value = firstDefined(attr, [
                    "PCB Footprint (" + key + ")",
                    "pcb footprint (" + key + ")",
                ]);
                const num = parseFloat(value);
                return isFinite(num) ? num : null;
            }

            function normalizeObjId(value) {
                if (typeof value === "string" && value.trim() !== "")
                    return value.trim();
                if (typeof value === "number" && isFinite(value))
                    return String(value);
                return null;
            }
            function isValidObjId(value) {
                return typeof value === "string" && value.trim() !== "";
            }
            function degreesToRadians(degrees) {
                return (degrees * Math.PI) / 180;
            }
            const MOUNTING_TYPE_SMD = "smd";
            const MOUNTING_TYPE_THROUGH_HOLE = "through-hole";
            const MOUNTING_TYPE_WALL_MOUNT = "wall-mount";
            function normalizeMountingType(value) {
                const text = String(
                    value === undefined || value === null ? "" : value,
                )
                    .trim()
                    .toLowerCase();
                if (
                    text.indexOf("surface") !== -1 ||
                    text.indexOf("smd") !== -1 ||
                    text.indexOf("smt") !== -1
                ) {
                    return MOUNTING_TYPE_SMD;
                }
                if (
                    text.indexOf("through") !== -1 ||
                    text.indexOf("tht") !== -1
                ) {
                    return MOUNTING_TYPE_THROUGH_HOLE;
                }
                if (text.indexOf("wall") !== -1) {
                    return MOUNTING_TYPE_WALL_MOUNT;
                }
                return MOUNTING_TYPE_SMD;
            }
            function readMountingTypeFromRecord(record) {
                const source = record && record.raw ? record.raw : record;
                if (!source || typeof source !== "object") return undefined;
                const attr =
                    firstDefined(source, ["json_attr", "Json_attr"]) || {};
                let value = firstDefined(attr, [
                    "Mounting Type",
                    "mounting type",
                    "Mounting_Type",
                    "mounting_type",
                ]);
                if (value === undefined) {
                    const attributes = firstDefined(source, [
                        "json_attr3",
                        "Json_attr3",
                    ]);
                    if (Array.isArray(attributes)) {
                        const match = attributes.find(
                            (entry) =>
                                entry &&
                                String(entry.pn || "")
                                    .trim()
                                    .toLowerCase() === "mounting type",
                        );
                        if (match) value = match.pv;
                    }
                }
                if (value === undefined) {
                    value = firstDefined(source, [
                        "Mounting Type",
                        "mounting type",
                        "Mounting_Type",
                        "mounting_type",
                    ]);
                }
                return value;
            }
            function getComponentMountingType(component) {
                const source =
                    component && component.userData
                        ? component.userData
                        : component;
                if (!source || typeof source !== "object")
                    return MOUNTING_TYPE_SMD;
                if (
                    source.mountingType !== undefined &&
                    source.mountingType !== null &&
                    source.mountingType !== ""
                ) {
                    return normalizeMountingType(source.mountingType);
                }
                const libraryEntry = resolveLibraryEntryFor({
                    obj_id: normalizeObjId(source.objId || source.obj_id),
                    partname: source.partname || source.part_name,
                });
                if (libraryEntry && libraryEntry.mountingType) {
                    return normalizeMountingType(libraryEntry.mountingType);
                }
                return normalizeMountingType(
                    readMountingTypeFromRecord(source),
                );
            }
            function formatMountingTypeLabel(mountingType) {
                const type = normalizeMountingType(mountingType);
                if (type === MOUNTING_TYPE_THROUGH_HOLE) return "Through-Hole";
                if (type === MOUNTING_TYPE_WALL_MOUNT) return "Wall Mount";
                return "SMD";
            }
            function normalizeComponent(raw) {
                const attr =
                    firstDefined(raw, ["json_attr", "Json_attr"]) || {};
                const width = readFootprint(attr, "Width");
                const length = readFootprint(attr, "Length");
                const height = readFootprint(attr, "Height");
                return {
                    partname:
                        firstDefined(raw, ["part_name", "Part_name", "name"]) ||
                        "Unknown",
                    group:
                        firstDefined(raw, ["group_name", "group name"]) ||
                        "N/A",
                    partNumber:
                        firstDefined(raw, ["part_number", "Part_number"]) || "",
                    vendor: firstDefined(raw, ["vendor", "Vendor"]) || "",
                    sgpName: firstDefined(raw, ["sgp_name", "Sgp_name"]) || "",
                    objId: normalizeObjId(
                        firstDefined(raw, [
                            "obj_id",
                            "Obj_id",
                            "objId",
                            "OBJ_ID",
                        ]),
                    ),
                    mountingType: normalizeMountingType(
                        readMountingTypeFromRecord(raw),
                    ),
                    "pcb footprint (width)":
                        width === null ? 1 : Math.max(1, Math.round(width)),
                    "pcb footprint (length)":
                        length === null ? 1 : Math.max(1, Math.round(length)),
                    "pcb footprint (height)": height === null ? 0.4 : height,
                    raw: raw,
                };
            }
            function renderComponentLoadError(message) {
                componentListEl.innerHTML =
                    '<div class="component-empty-msg">' +
                    escapeHTML(message) +
                    "</div>";
            }
            fetch("./cmplist.json")
                .then((res) => {
                    if (!res.ok)
                        throw new Error("server replied " + res.status);
                    return res.json();
                })
                .then((data) => {
                    const records = extractComponentRecords(data);
                    if (records.length === 0) {
                        throw new Error(
                            "no component records found in the file",
                        );
                    }
                    componentData = records.map(normalizeComponent);
                    applyFilters();
                })
                .catch((err) => {
                    console.error("Failed to load cmplist.json:", err);
                    componentData = [];
                    renderComponentLoadError(
                        "Could not load the component library. Check that cmplist.json sits next to index.html and is valid JSON.",
                    );
                    showStatusToast(
                        "Component library failed to load — " + err.message,
                        "error",
                    );
                });
            const filterState = {
                term: "",
                groups: new Set(),
                sgps: new Set(),
            };
            function matchesTerm(comp) {
                return (
                    !filterState.term ||
                    comp.partname.toLowerCase().indexOf(filterState.term) !== -1
                );
            }
            function matchesSgp(comp) {
                return (
                    filterState.sgps.size === 0 ||
                    filterState.sgps.has(comp.sgpName)
                );
            }
            function matchesGroup(comp) {
                return (
                    filterState.groups.size === 0 ||
                    filterState.groups.has(comp.group)
                );
            }
            function getFilteredComponents() {
                return componentData.filter(
                    (c) => matchesTerm(c) && matchesSgp(c) && matchesGroup(c),
                );
            }
            function getCandidateComponents() {
                return componentData.filter(
                    (c) => matchesTerm(c) && matchesSgp(c),
                );
            }
            function applyFilters() {
                syncSgpFilterButton();
                renderComponentList(
                    getFilteredComponents(),
                    getCandidateComponents(),
                );
            }
            componentSearchEl.addEventListener("input", () => {
                filterState.term = componentSearchEl.value.trim().toLowerCase();
                applyFilters();
            });
            function syncSgpFilterButton() {
                const n = filterState.sgps.size;
                sgpFilterLabelEl.textContent =
                    n === 0
                        ? "All sub-groups"
                        : n === 1
                          ? "1 selected"
                          : n + " selected";
                sgpFilterBtnEl.classList.toggle("active", n > 0);
            }
            function toggleSgp(name) {
                if (filterState.sgps.has(name)) filterState.sgps.delete(name);
                else filterState.sgps.add(name);
                applyFilters();
            }
            function setSgpMenuOpen(open) {
                sgpFilterBtnEl.classList.toggle("open", open);
                sgpFilterBtnEl.setAttribute(
                    "aria-expanded",
                    open ? "true" : "false",
                );
                sgpFilterMenuEl.hidden = !open;
            }
            function refreshSgpFilterMenu() {
                const totals = new Map();
                const counts = new Map();
                componentData.forEach((comp) => {
                    totals.set(
                        comp.sgpName,
                        (totals.get(comp.sgpName) || 0) + 1,
                    );
                });
                componentData
                    .filter((c) => matchesTerm(c) && matchesGroup(c))
                    .forEach((comp) =>
                        counts.set(
                            comp.sgpName,
                            (counts.get(comp.sgpName) || 0) + 1,
                        ),
                    );
                Array.from(filterState.sgps).forEach((name) => {
                    if (!totals.has(name)) filterState.sgps.delete(name);
                });
                const scrollTop = sgpFilterMenuEl.scrollTop;
                sgpFilterMenuEl.innerHTML = "";
                const actions = document.createElement("div");
                actions.className = "ms-actions";
                const selectAllBtn = document.createElement("button");
                selectAllBtn.type = "button";
                selectAllBtn.className = "ms-action-btn";
                selectAllBtn.textContent = "Select all";
                selectAllBtn.addEventListener("click", () => {
                    totals.forEach((_total, name) =>
                        filterState.sgps.add(name),
                    );
                    applyFilters();
                });
                const clearBtn = document.createElement("button");
                clearBtn.type = "button";
                clearBtn.className = "ms-action-btn";
                clearBtn.textContent = "Clear";
                clearBtn.addEventListener("click", () => {
                    filterState.sgps.clear();
                    applyFilters();
                });
                actions.appendChild(selectAllBtn);
                actions.appendChild(clearBtn);
                sgpFilterMenuEl.appendChild(actions);
                Array.from(totals.keys())
                    .sort((a, b) => a.localeCompare(b))
                    .forEach((name) => {
                        const total = totals.get(name);
                        const count = counts.get(name) || 0;
                        const selected = filterState.sgps.has(name);
                        const option = document.createElement("button");
                        option.type = "button";
                        option.className = "ms-option";
                        option.setAttribute("role", "option");
                        option.setAttribute(
                            "aria-selected",
                            selected ? "true" : "false",
                        );
                        option.disabled = count === 0 && !selected;
                        if (selected) option.classList.add("selected");
                        const check = document.createElement("span");
                        check.className = "ms-check";
                        check.textContent = selected ? "✓" : "";
                        option.appendChild(check);
                        const nameEl = document.createElement("span");
                        nameEl.className = "ms-name";
                        nameEl.textContent = name || "N/A";
                        option.appendChild(nameEl);
                        const countEl = document.createElement("span");
                        countEl.className =
                            count === 0 ? "ms-count zero" : "ms-count";
                        countEl.textContent =
                            count === total
                                ? String(total)
                                : count + "/" + total;
                        option.appendChild(countEl);
                        option.addEventListener("click", () => toggleSgp(name));
                        sgpFilterMenuEl.appendChild(option);
                    });
                sgpFilterMenuEl.scrollTop = scrollTop;
            }
            sgpFilterBtnEl.addEventListener("click", (event) => {
                event.stopPropagation();
                const open = sgpFilterMenuEl.hidden;
                if (open) refreshSgpFilterMenu();
                setSgpMenuOpen(open);
            });
            sgpFilterMenuEl.addEventListener("click", (event) => {
                event.stopPropagation();
            });
            document.addEventListener("click", (event) => {
                if (sgpFilterMenuEl.hidden) return;
                if (sgpFilterMenuEl.contains(event.target)) return;
                setSgpMenuOpen(false);
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !sgpFilterMenuEl.hidden)
                    setSgpMenuOpen(false);
            });
            function getComponentColor(comp) {
                let hash = 0;
                for (let i = 0; i < comp.partname.length; i++) {
                    hash = comp.partname.charCodeAt(i) + ((hash << 5) - hash);
                }
                const hue = Math.abs(hash) % 250;
                const saturation = /active/i.test(comp.group) ? 70 : 40;
                const lightness = /active/i.test(comp.group) ? 55 : 45;
                const hslColor = new THREE.Color(
                    `hsl(${hue}, ${saturation}%, ${lightness}%)`,
                );
                return hslColor.getHex();
            }

            let manualPlacementSide = null;
            function getPlacementSideForCurrentView() {
                if (manualPlacementSide) return manualPlacementSide;
                return currentViewMode === "bottom" ? "bottom" : "top";
            }
            function setManualPlacementSide(side) {
                manualPlacementSide = side;
                var btnTop = document.getElementById("btn-side-top");
                var btnBottom = document.getElementById("btn-side-bottom");
                if (btnTop) btnTop.classList.toggle("active", side === "top");
                if (btnBottom)
                    btnBottom.classList.toggle("active", side === "bottom");
                updateLibrarySelectionBanner();
            }

            function updateLibrarySelectionBanner() {
                if (!selectedComponent) {
                    selectedBannerEl.classList.remove("visible");
                    return;
                }
                const comp = selectedComponent;
                selectedBannerEl.classList.add("visible");
                const effectiveSide = getPlacementSideForCurrentView();
                const sideText =
                    effectiveSide === "bottom"
                        ? "the BOTTOM side" +
                          (manualPlacementSide
                              ? " (manually set)"
                              : " (Bottom View active)")
                        : "the TOP side" +
                          (manualPlacementSide
                              ? " (manually set)"
                              : " (Top / Orbit View active)");
                selectedBannerEl.textContent =
                    "Selected: " +
                    comp.partname +
                    " — click the board to place it on " +
                    sideText +

            const REFERENCE_PREFIX_RULES = [

                { pattern: /CAPACITOR|\bCAP[-_ ]/i, prefix: "C" },
                { pattern: /INDUCTOR|\bIND[-_ ]/i, prefix: "L" },
                { pattern: /^(LED|LIGHT)/i, prefix: "LED" },
                { pattern: /TRANSISTOR|\bFET\b|^2N|^3N|^BC/i, prefix: "Q" },
                { pattern: /DIODE|^1N4|RECTIFIER/i, prefix: "D" },
                { pattern: /CRYSTAL|XTAL|OSCILLATOR/i, prefix: "Y" },
                { pattern: /CONNECTOR|\bCONN\b|HEADER/i, prefix: "J" },
                { pattern: /SWITCH|\bSW[-_ ]/i, prefix: "SW" },
                { pattern: /FUSE/i, prefix: "F" },
                { pattern: /TRANSFORMER|\bXFMR\b/i, prefix: "T" },
                { pattern: /TEST\s*POINT|\bTP[-_ ]/i, prefix: "TP" },
                {
                    pattern:
                        /\bIC\b|MEMORY|FPGA|OP-?AMP|REGULATOR|INTERFACE|MICROCONTROLLER|ADC-?DAC|\bDAC\b|\bADC\b|\bSRAM\b|\bFLASH\b|\bEEPROM\b/i,
                    prefix: "C",
                },
            ];
            function getReferencePrefix(info) {
                const haystack = [
                    info.partname,
                    info.partNumber,
                    info.sgpName,
                    info.group,
                ]
                    .filter(Boolean)
                    .join(" ");
                for (let i = 0; i < REFERENCE_PREFIX_RULES.length; i++) {
                    if (REFERENCE_PREFIX_RULES[i].pattern.test(haystack)) {
                        return REFERENCE_PREFIX_RULES[i].prefix;
                    }
                }
                const letters = /^[A-Za-z]{1,4}/.exec(
                    String(info.partname || ""),
                );
                if (letters) return letters[0].toUpperCase();
                return "C";
            }
            function nextReferenceLabel(prefix, used) {
                let n = 1;
                while (used.has(prefix + n)) n += 1;
                const label = prefix + n;
                used.add(label);
                return label;
            }

            function assignReferenceLabels(preferredRefs) {
                const used = new Set();
                spawnedComponents.forEach((mesh) => {
                    const info = mesh.userData;
                    const prefix = getReferencePrefix(info);
                    const preferred = preferredRefs
                        ? preferredRefs[info.uid]
                        : null;
                    let reference = null;
                    if (
                        typeof preferred === "string" &&
                        preferred !== "" &&
                        preferred.indexOf(prefix) === 0 &&
                        !used.has(preferred)
                    ) {
                        reference = preferred;
                        used.add(reference);
                    }
                    if (!reference)
                        reference = nextReferenceLabel(prefix, used);
                    if (info.reference !== reference) {
                        info.reference = reference;
                        updateComponentLabel(mesh);
                    }
                });

            const LABEL_TEXTURES = new Map();
            function drawRoundedRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                const font = "700 44px Arial, Helvetica, sans-serif";
                ctx.font = font;
                const textWidth = Math.ceil(ctx.measureText(text).width);
                const paddingX = 20;
                const paddingY = 14;
                canvas.width = textWidth + paddingX * 2;
                canvas.height = 44 + paddingY * 2;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.font = font;
                drawRoundedRect(
                    ctx,
                    2,
                    2,
                    canvas.width - 4,
                    canvas.height - 4,
                    12,
                );
                ctx.fillStyle = "rgba(8, 14, 28, 0.88)";
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(150, 205, 255, 0.95)";
                ctx.stroke();
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 2);

                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.needsUpdate = true;

                const image =

                const aspect =

                return { width: height * aspect, height: height };
            }

            function positionComponentLabel(mesh) {

                info.label.position.set(

                const texture = getLabelTexture(text);

                const material = new THREE.SpriteMaterial({

                    depthTest: true,
                    depthWrite: false,
                    transparent: true,
                    sizeAttenuation: true,

                sprite.renderOrder = 2;
                info.label = sprite;

                positionComponentLabel(mesh);

                const info = mesh.userData;
                if (!info.label) {
                    createComponentLabel(mesh);

                const texture = getLabelTexture(info.reference || "?");
                if (info.labelTexture === texture) return;

                info.label.material.map = texture;

            let componentUidCounter = 0;

                    gridX: Math.floor(entry.gridX),

                    width: Math.max(1, Math.round(entry.width)),
                    length: Math.max(1, Math.round(entry.length)),

                        isFiniteNumber(entry.meshHeight) && entry.meshHeight > 0
                            ? entry.meshHeight

                    color: info.colorHex,
                    roughness: 0.5,

                mesh.userData = info;

                scene.add(mesh);
                spawnedComponents.push(mesh);
                return mesh;
            }

            function spawnComponent(

                gridZ,
                compWidth,
                compLength,
                colorHex,

                const placementSide = normalizeSide(side);

                        gridZ,
                        compWidth,
                        compLength,
                        placementSide,
                        mountingType,

                    return null;

                const mesh = createComponentMesh({
                    gridX: gridX,
                    gridZ: gridZ,
                    width: compWidth,
                    length: compLength,
                    meshHeight:

                    partname: comp.partname || "Unknown",
                    partNumber: comp.partNumber || "",
                    group: comp.group || "unknown",
                    sgpName: comp.sgpName || "",

                    colorHex: colorHex,
                    side: placementSide,
                    mountingType: mountingType,
                    rotation: 0,
                    reference: "",

                updateComponentHighlights();
                updateInspector();

            const HIGHLIGHT_INSPECTED = 0x2a5c33;
            const HIGHLIGHT_SELECTED = 0x1f4f8f;
            const groupSelectionBannerEl = document.getElementById(
                "group-selection-banner",
            );

            function isComponentSelected(mesh) {

            }

            function updateComponentHighlights() {
                spawnedComponents.forEach((m) => {
                    if (!m.material.emissive) return;
                    let color = 0x000000;
                    if (isComponentSelected(m)) color = HIGHLIGHT_SELECTED;
                    if (inspectedMesh === m) color = HIGHLIGHT_INSPECTED;
                    m.material.emissive.set(color);

            }

            function selectComponent(mesh) {

                updateInspector();

            function toggleComponentSelection(mesh) {
                if (!mesh) return;
                const at = groupSelection.indexOf(mesh);
                if (at === -1) {
                    groupSelection.push(mesh);
                    inspectedMesh = mesh;
                } else {
                    groupSelection.splice(at, 1);
                    if (inspectedMesh === mesh)
                        inspectedMesh = groupSelection.length
                            ? groupSelection[groupSelection.length - 1]
                            : null;
                }
                updateComponentHighlights();
                updateGroupSelectionBanner();
                updateInspector();
            }

            function clearComponentSelection() {
                if (groupSelection.length === 0 && inspectedMesh === null)
                    return;
                groupSelection = [];
                inspectedMesh = null;
                updateComponentHighlights();
                updateGroupSelectionBanner();
                updateInspector();

            function getSelectedComponents() {
                return groupSelection.filter(
                    (m) => spawnedComponents.indexOf(m) !== -1,

            }
            function updateGroupSelectionBanner() {
                const members = getSelectedComponents();
                if (members.length === 0) {
                    groupSelectionBannerEl.classList.remove("visible");
                    groupSelectionBannerEl.textContent = "";
                    return;
                }
                const names = members
                    .map((m) => m.userData.reference)
                    .join(", ");
                groupSelectionBannerEl.classList.add("visible");
                groupSelectionBannerEl.innerHTML =
                    escapeHTML(
                        members.length === 1
                            ? "1 component selected: " + names
                            : members.length + " components selected: " + names,
                    ) +
                    '<span class="group-hint">Drag any highlighted component to move the whole group · ' +
                    "Ctrl+click / Shift+click to add or remove · Esc clears the selection</span>";
            }

            function captureSelectionSnapshot() {
                return {
                    inspected: inspectedMesh
                        ? inspectedMesh.userData.uid
                        : null,
                    group: getSelectedComponents().map((m) => m.userData.uid),
                };
            }
            function restoreSelectionSnapshot(snapshot) {
                if (!snapshot) return;
                const byUid = new Map();
                spawnedComponents.forEach((m) => byUid.set(m.userData.uid, m));
                inspectedMesh =
                    snapshot.inspected !== null && byUid.has(snapshot.inspected)
                        ? byUid.get(snapshot.inspected)
                        : null;
                groupSelection = (snapshot.group || [])
                    .map((uid) => byUid.get(uid))
                    .filter(Boolean);
                updateGroupSelectionBanner();
            }
            let isEraseMode = false;
            let currentTool = "select";
            const btnSelect = document.getElementById("btn-select");
            const btnErase = document.getElementById("btn-erase");
            let spawnedComponents = [];

            let inspectedMesh = null;
            let groupSelection = [];

            const HISTORY_LIMIT = 50;
            let designHistory = [];
            let historyPointer = -1;

            function serializeDesign() {
                return JSON.stringify({
                    width: boardWidth,
                    length: boardLength,
                    height: boardHeight,
                    components: spawnedComponents.map((m) => ({
                        uid: m.userData.uid,
                        gridX: m.userData.gridX,
                        gridZ: m.userData.gridZ,
                        width: m.userData.width,
                        length: m.userData.length,
                        meshHeight: m.userData.meshHeight,
                        partname: m.userData.partname,
                        partNumber: m.userData.partNumber,
                        group: m.userData.group,
                        sgpName: m.userData.sgpName,
                        objId: m.userData.objId,
                        colorHex: m.userData.colorHex,
                        side: m.userData.side,
                        mountingType: getComponentMountingType(m),
                        rotation: m.userData.rotation,
                        reference: m.userData.reference,
                    })),
                });
            }
            function saveState() {
                pushHistoryPoint(serializeDesign());

                if (typeof refreshUndoRedoButtons === "function")
                    refreshUndoRedoButtons();
            }
            function pushHistoryPoint(designSnapshot) {
                designHistory = designHistory.slice(0, historyPointer + 1);

                if (
                    designHistory[designHistory.length - 1] === designSnapshot
                ) {
                    historyPointer = designHistory.length - 1;
                    return;
                }
                designHistory.push(designSnapshot);
                if (designHistory.length > HISTORY_LIMIT) designHistory.shift();
                historyPointer = designHistory.length - 1;
            }
            function clearHistory() {
                designHistory = [];
                historyPointer = -1;
            }
            function removeAllComponents() {
                spawnedComponents
                    .slice()
                    .forEach((m) => removeComponentMesh(m));
                spawnedComponents = [];
                inspectedMesh = null;
                groupSelection = [];
            }

            function restoreDesign(json) {
                const data = typeof json === "string" ? JSON.parse(json) : json;
                const selectionBefore = captureSelectionSnapshot();
                removeAllComponents();
                componentUidCounter = 0;
                const entries = data.components || [];

                entries.forEach((c) => {
                    if (isFiniteNumber(c.uid))
                        componentUidCounter = Math.max(
                            componentUidCounter,
                            c.uid,
                        );
                });
                inputWidth.value = data.width;
                inputLength.value = data.length;
                inputHeight.value = isFiniteNumber(data.height)
                    ? data.height
                    : 1;
                updateBoardSize({ skipCamera: true, rebuildComponents: false });

                initializeGridSystem(
                    Math.floor(boardWidth),
                    Math.floor(boardLength),
                );
                const preferredRefs = {};
                let skipped = 0;
                entries.forEach((c) => {
                    const mesh = createComponentMesh(c);
                    if (
                        placeComponent(
                            mesh.userData.gridX,
                            mesh.userData.gridZ,
                            mesh.userData.width,
                            mesh.userData.length,
                            mesh.userData.side,
                            getComponentMountingType(mesh),
                        )
                    ) {
                        preferredRefs[mesh.userData.uid] = c.reference || "";
                    } else {
                        skipped += 1;

                restoreSelectionSnapshot(selectionBefore);
                updateComponentHighlights();
                updateInspector();
                return skipped;
            }
            function undo() {
                if (historyPointer <= 0) {
                    showStatusToast("Nothing left to undo.", "error");
                    refreshUndoRedoButtons();
                    return;
                }
                restoreDesign(designHistory[historyPointer - 1]);
                historyPointer -= 1;
                refreshUndoRedoButtons();
            }
            function redo() {
                if (historyPointer >= designHistory.length - 1) {
                    showStatusToast("Nothing left to redo.", "error");
                    refreshUndoRedoButtons();

                historyPointer += 1;
                refreshUndoRedoButtons();

            const PROJECT_FORMAT = "pcb-circuit-designer";
            const PROJECT_VERSION = 1;
            const MAX_SAVED_COMPONENTS = 5000;
            const importFileEl = document.getElementById("import-file");
            const statusToastEl = document.getElementById("status-toast");
            const placementToastEl = document.getElementById("placement-toast");
            const toastTimers = { status: null, placement: null };
            function presentToast(el, key, message, kind, duration) {

                toastTimers[key] = setTimeout(() => {
                    el.classList.remove("visible");
                }, duration);
            }
            function showStatusToast(message, kind) {

            function placementErrorMessage(problem) {
                return problem === "collision"
                    ? "Something is already there — that spot is occupied."
                    : "That part would hang off the edge of the board.";

            function showPlacementError(message) {
                presentToast(
                    placementToastEl,
                    "placement",
                    "⚠ " + message,
                    "error",
                    4000,
                );
            }
            function buildProjectData() {
                return {
                    format: PROJECT_FORMAT,
                    version: PROJECT_VERSION,
                    board: {
                        width: boardWidth,
                        length: boardLength,
                        height: boardHeight,
                    },

                    components: spawnedComponents.map((m) => ({
                        obj_id: normalizeObjId(m.userData.objId),
                        partname: m.userData.partname,
                        group: m.userData.group,
                        reference: m.userData.reference,
                        gridX: m.userData.gridX,
                        gridZ: m.userData.gridZ,
                        width: m.userData.width,
                        length: m.userData.length,
                        meshHeight: m.userData.meshHeight,

                        side: m.userData.side,
                        mountingType: getComponentMountingType(m),
                        rotation: m.userData.rotation,
                    })),

            }
            function buildDefaultExportFileName(project) {
                const stamp = new Date()
                    .toISOString()
                    .slice(0, 16)
                    .replace(/[:T]/g, "-");
                return (
                    "pcb-" +
                    Math.round(project.board.width) +
                    "x" +
                    Math.round(project.board.length) +
                    "-" +
                    stamp +
                    ".json"
                );
            }
            function sanitizeExportFileName(rawName) {
                let base = String(
                    rawName === undefined || rawName === null ? "" : rawName,
                ).trim();
                if (!base) return "";
                base = base.replace(/[. ]+$/g, "").trim();
                base = base.replace(/\.json$/i, "");
                base = base
                    .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_")
                    .replace(/\s+/g, " ")
                    .trim();
                base = base.replace(/[. ]+$/g, "");
                if (!base || base === "." || base === "..") return "";
                base = base.slice(0, 120).replace(/[. ]+$/g, "");
                if (!base) return "";
                if (
                    /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(base)
                ) {
                    base = "_" + base;
                }
                return base + ".json";

            function promptForExportFileName(defaultName) {
                const entered = window.prompt(
                    "Enter a file name for the PCB design:",
                    defaultName,

                if (entered === null) return null;
                const fileName = sanitizeExportFileName(entered);
                if (!fileName) {
                    showStatusToast(
                        "Enter a file name to save the PCB design.",
                        "error",
                    );

                return fileName;

            function exportProjectJSON() {
                const project = buildProjectData();
                const defaultName = buildDefaultExportFileName(project);
                const fileName = promptForExportFileName(defaultName);
                if (!fileName) return;
                const blob = new Blob([JSON.stringify(project, null, 2)], {
                    type: "application/json",

                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;

                link.remove();

                const n = project.components.length;
                showStatusToast(
                    "Exported " +
                        n +
                        " component" +
                        (n === 1 ? "" : "s") +
                        " to " +
                        fileName,
                    "success",
                );
            }
            function validateProjectData(data) {
                const fail = (error) => ({ ok: false, error: error });
                if (
                    data === null ||
                    typeof data !== "object" ||
                    Array.isArray(data)
                ) {
                    return fail("This file does not contain a PCB design.");
                }
                if (data.format && data.format !== PROJECT_FORMAT) {
                    return fail(
                        'Unrecognised file format "' + data.format + '".',

                }
                if (!data.board || typeof data.board !== "object") {
                    return fail("The file is missing the board size.");
                }
                if (!isFiniteNumber(data.board.width) || data.board.width < 1) {
                    return fail(
                        "Board width must be a number of at least 1 mm.",

                }
                if (
                    !isFiniteNumber(data.board.length) ||
                    data.board.length < 1
                ) {
                    return fail(
                        "Board length must be a number of at least 1 mm.",

                if (
                    data.board.height !== undefined &&
                    (!isFiniteNumber(data.board.height) ||
                        data.board.height < MIN_BOARD_HEIGHT_MM)

                    return fail(
                        "Board height must be a number of at least " +
                            MIN_BOARD_HEIGHT_MM +
                            " mm.",

                if (!Array.isArray(data.components)) {
                    return fail("The file has no valid list of components.");
                }
                if (data.components.length > MAX_SAVED_COMPONENTS) {
                    return fail(
                        "The file holds more than " +
                            MAX_SAVED_COMPONENTS +
                            " components.",
                    );
                }
                const problems = [];
                data.components.forEach((c, i) => {
                    const at = "Component #" + (i + 1) + " ";
                    if (c === null || typeof c !== "object") {
                        problems.push(at + "is not a valid entry.");
                        return;
                    }
                    if (!isFiniteNumber(c.gridX) || !isFiniteNumber(c.gridZ)) {
                        problems.push(at + "has an invalid grid position.");
                    } else if (c.gridX < 0 || c.gridZ < 0) {
                        problems.push(at + "sits at a negative grid position.");
                    }
                    if (!isFiniteNumber(c.width) || c.width < 1) {
                        problems.push(at + "has an invalid width.");
                    }
                    if (!isFiniteNumber(c.length) || c.length < 1) {
                        problems.push(at + "has an invalid length.");
                    }
                    if (
                        c.meshHeight !== undefined &&
                        !isFiniteNumber(c.meshHeight)
                    ) {
                        problems.push(at + "has an invalid height.");
                    }
                    if (
                        typeof c.partname !== "string" ||
                        c.partname.trim() === ""
                    ) {
                        problems.push(at + "is missing its part name.");
                    }

                    if (
                        c.side !== undefined &&
                        normalizeSide(c.side) === "top" &&
                        String(c.side).toLowerCase() !== "top"
                    ) {
                        problems.push(

                    }
                    if (
                        c.rotation !== undefined &&
                        !isFiniteNumber(c.rotation)
                    ) {
                        problems.push(at + "has an invalid rotation.");
                    }
                });
                if (problems.length > 0) {
                    const shown = problems.slice(0, 3).join(" ");
                    const more =
                        problems.length > 3
